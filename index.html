let lastGold=0;
function refreshPartPanel(){
  const pp=el("partPanel");
  if (!selNode||!nodes.includes(selNode)||!selNode.ref||drawerTab>=0){
    pp.style.display="none"; return;
  }
  const n=selNode, lvl=mkOf(n);
  const nm=n.role==="mach"?MACHINES[n.mt].label:KINDS[n.kind].name;
  pp.style.display="block";
  el("ppName").textContent=nm+(lvl?"  "+MK[lvl].n:"");
  el("ppInfo").textContent=
    "obroty "+Math.round(Math.abs(n.rpm))+" · moment "+Math.abs(n.torque).toFixed(2)+
    (lvl?("  ·  straty −"+Math.round((1-MK[lvl].loss)*100)+"%"):"")+
    (n.role==="mach"?("  ·  pobór "+(n.draw||0).toFixed(2)):"");
  const up=el("ppUp");
  up.textContent=lvl>=2?"Najwyższy poziom":("Ulepsz do "+MK[lvl+1].n+" · "+fmt(mkCost(n)));
  up.disabled=lvl>=2||S.gold<mkCost(n);
}

function refreshHUD(){
  const g=el("gold");
  g.textContent=fmt(S.gold);
  if (S.gold-lastGold>Math.max(1,S.gold*.004)){
    g.classList.add("pop"); setTimeout(()=>g.classList.remove("pop"),100);
  }
  lastGold=S.gold;
  const cp=siloCap(), fr=Math.min(1,S.ore/cp);
  el("siloFill").style.width=(fr*100)+"%";
  el("siloBar").classList.toggle("full",fr>.9);
  el("siloTxt").textContent=fmt(S.ore)+" / "+fmt(cp);
  el("rateV").textContent="+"+fmt(goldPerSec)+"/s";
  el("debtV").textContent=S.debt>0?("−"+fmt(S.debt)+" dług"):"";
  el("rpmV").textContent=Math.round(totalRpm);
  el("tqV").textContent=totalTq.toFixed(1);
  el("depthV").textContent=machNodes.reduce((a,m)=>Math.max(a,m.depth||0),0).toFixed(1);
  el("kursV").textContent=(priceOf(bestMerch())/Math.max(.001,oreValue())).toFixed(2);
  el("powV").textContent=powerDraw.toFixed(1)+"/"+powerCap().toFixed(1);
  el("powV").style.color=(powerDraw>powerCap())?"#e0735a":"";
  el("rpV").textContent=fmt(S.rp||0);
  el("boostbar").style.width=(boost/BOOST_MAX*100)+"%";

  const dead=machNodes.filter(m=>!m.powered).length;
  const noPipe=machNodes.filter(m=>(m.mt===M_DRILL||m.mt===M_CRUSH)&&m.powered&&!m.dep).length;
  let h="";
  if (chainMode) h=beltFirst?"Łańcuch: wybierz drugie koło":"Łańcuch: wybierz pierwsze koło (2x lub większe)";
  else if (shaftMode) h=beltFirst?"Wał: wybierz drugą zębatkę":"Wał: wybierz pierwszą zębatkę";
  else if (beltMode) h=beltFirst?"Wybierz drugą zębatkę":"Wybierz pierwszą zębatkę";
  else if (performance.now()<hintUntil) h=hintMsg;
  else if (jammed) h="ZAKLESZCZENIE — sprzeczne kierunki w pętli";
  else if (S.ore>=siloCap()*.98) h="SILOS PEŁNY — sprzedaj surowiec";
  else if (machNodes.some(m=>m.inRock&&m.powered&&!m.tqOk))
    h="Wiertło utknęło w litej skale — dołóż momentu albo przesuń szyb w bok";
  else if (machNodes.some(m=>m.atBottom&&m.powered))
    h="Wiertło doszło do dna wykupionego terenu — kup sektor głębiej";
  else if (dead) h=dead+" maszyna bez napędu";
  else if (S.msn<MISSIONS.length) h="▸ "+MISSIONS[S.msn].t+"  (+"+MISSIONS[S.msn].r+"⬢)";
  el("hint").textContent=h;

  tabBtns[T_PARTS].classList.toggle("buy",S.gold>=pipeCost()||KINDS.some((k,i)=>unlocked(i)&&(freeOf(i)>0||S.gold>=gearCost(i))));
  tabBtns[T_MACH].classList.toggle("buy",MACHINES.some((m,i)=>S.gold>=machCost(i)));
  tabBtns[T_MARKET].classList.toggle("buy",S.ore>=siloCap()*.5);
  tabBtns[T_MAP].classList.toggle("buy",offers().some(o=>S.gold>=o.cost));
  tabBtns[T_RES].classList.toggle("buy",RESEARCH.some(n=>!R(n.id)&&!resLocked(n)&&(S.rp||0)>=n.c));
  tabBtns[T_DEV].classList.toggle("buy",UPGRADES.some((u,i)=>S.gold>=upCost(i)&&!(u.max&&S.ulvl[i]>=u.max))
    ||prestigeGain()>0||PERKS.some((p,i)=>S.shards>=perkCost(i)&&S.perk[i]<p.max));

  if (drawerTab>=0) refreshDrawer();
  refreshPartPanel();
}

function tutStart(){
  if (S.tut===undefined) S.tut=0;
  if (S.tut>=TUT.length){ el("tut").style.display="none"; tutOn=false; return; }
  tutOn=true; tutT=0;
  el("tut").style.display="block";
  const st=TUT[S.tut];
  el("tutStep").textContent="Krok "+(S.tut+1)+" z "+TUT.length;
  el("tutText").textContent=st.t;
  el("tutNext").textContent=st.last?"Zaczynamy":"Dalej";
  tutMark = S.tut===5 ? S.gold : (S.tut===7 ? S.gears.length : 0);
  tutLayout();
}
function tutNext(){
  S.tut=(S.tut||0)+1;
  if (S.tut>=TUT.length){ tutEnd(); return; }
  tutStart();
}
function tutEnd(){ track("tutorial_done_or_skipped",{krok:S.tut}); S.tut=TUT.length; tutOn=false; el("tut").style.display="none"; save(); }

function tutLayout(){
  if (!tutOn) return;
  const st=TUT[S.tut]; if (!st) return;
  const r=st.r&&st.r();
  const ring=el("tutRing"), arr=el("tutArrow"), box=el("tutBox");
  if (r&&r.w>0){
    ring.style.display="block"; arr.style.display="block";
    ring.style.left=(r.x-8)+"px"; ring.style.top=(r.y-8)+"px";
    ring.style.width=(r.w+16)+"px"; ring.style.height=(r.h+16)+"px";
    const below=(r.y+r.h/2)<innerHeight*.5;
    arr.className=below?"":"up";
    arr.style.left=(r.x+r.w/2-13)+"px";
    arr.style.top=below?(r.y+r.h+12)+"px":(r.y-32)+"px";
    box.style.top=below?"auto":"14px";
    box.style.bottom=below?"14px":"auto";
  } else {
    ring.style.display="none"; arr.style.display="none";
    box.style.bottom="14px"; box.style.top="auto";
  }
}
function tutTick(dt){
  if (!tutOn) return;
  tutT+=dt; tutLayout();
  const st=TUT[S.tut];
  if (st&&st.ok&&st.ok()){ sfx.buy(); tutNext(); }
}

function renderMenu(view){
  const body=el("menuBody"); body.innerHTML="";
  if (view==="help"){
    const d=document.createElement("div"); d.className="help";
    d.innerHTML=`
      <p><b>Nie zarabiasz z wydobycia.</b> Wiertło i kruszarka produkują <b>surowiec</b>, który
      ląduje w silosie. Złoto dostajesz dopiero, gdy sprzedasz go kupcowi na giełdzie.</p>
      <p><b>Giełda.</b> Trzej kupcy mają niezależnie falujące ceny. Wykres u góry pokazuje
      historię. Sprzedawaj na górce, magazynuj w dołku. Pełny silos marnuje urobek —
      rozbuduj go albo sprzedaj szybciej.</p>
      <p><b>Powierzchnia to warsztat.</b> Górna warstwa jest pusta — to skała płonna, w której
      budujesz przekładnie i stawiasz maszyny. Ruda zaczyna się dopiero pod nią, więc wiertło
      ustawia się przy samym dnie powierzchni i stamtąd schodzi w dół.</p>
      <p><b>Warstwy i drążenie.</b> Ziemia dzieli się na warstwy — każdy rząd sektorów to
      inna ruda i inna <b>twardość</b>. Wiertło stawiasz na powierzchni i ono samo wierci w dół.
      <b>Obroty</b> decydują, jak szybko schodzi i ile urabia. <b>Moment</b> decyduje, czy w ogóle
      przebije kolejną warstwę. Za słaby moment nie zatrzymuje wiertła, ale drastycznie zwalnia —
      odczyt pod maszyną pokazuje tempo w procentach i ile momentu brakuje.</p>
      <p>Im głębiej, tym bogatsza ruda i twardsza skała, więc potrzebujesz naraz przyspieszaczy P
      na obroty i wzmacniaczy M na moment. Wyczerpana warstwa przestaje dawać urobek — wtedy
      schodzisz niżej albo kupujesz sektor obok.</p>
      <p><b>Żyły i zwiad.</b> Każdy wykupiony sektor od razu pokazuje swoją żyłę — rozsyp
      kolorowych ziaren rudy, którego nasycenie mówi, ile jeszcze zostało. Kolor to jakość:
      szara Uboga, niebieska Zwykła, zielona Bogata, złota Wyjątkowa.</p>
      <p><b>Sejsmograf.</b> Nie odsłania Twojego terenu, tylko robi <b>zwiad</b> w sektorach,
      których jeszcze nie kupiłeś. Dzięki niemu wiesz, co kupujesz, zanim zapłacisz.
      Działa przy <b>250 RPM (±25)</b> — regulator pomaga trafić w próg.</p>
      <p><b>Regulator obrotów.</b> Nie musisz trafiać w próg przekładniami. Wstaw regulator
      przed maszyną i tapnij go, by wybrać limit: 250, 350, 900, 1500 albo bez limitu.
      Ścina obroty za sobą do progu, a nadmiar zamienia w moment — więc pod kruszarkę
      działa podwójnie dobrze. Nad każdą maszyną widnieje jej aktualny odczyt obrotów,
      zielony gdy warunek jest spełniony.</p>
      <p><b>Wał napędowy.</b> Sztywny drąg między dwiema zębatkami. Nie odwraca kierunku
      i traci tylko 3% mocy zamiast 18% jak pasek — ale blokuje całą linię, którą biegnie.</p>
      <p><b>Sprzęgło.</b> Kliknij, by odciąć gałąź. Odetnij wiertła, a cała moc pójdzie
      w pompy zrzutowe, które sprzedają surowiec automatycznie (15% poniżej ceny).</p>
      <p><b>Przekładnie.</b> <b>P</b> = małe wejście, duże wyjście → mnoży obroty.
      <b>M</b> = odwrotnie → mnoży moment. Zwykłe zębatki tylko przenoszą napęd.</p>
      <p><b>Lita skała.</b> W głębszych warstwach trafiają się ciemne bloki. Robią dwie rzeczy:
      nie da się na nich nic postawić, a wiertło, które w nie trafi, potrzebuje prawie trzy razy
      więcej momentu. Albo przesuwasz szyb w bok, albo dokładasz wzmacniaczy.</p>
      <p><b>Podgląd gałęzi.</b> Stuknij zębatkę bez przeciągania, a podświetli się cała droga

      <p><b>Wspólny budżet mocy.</b> Silnik ma ograniczony zapas. Każda podłączona maszyna
      pobiera moc równą swoim obrotom razy moment — szybkie wiertło potrafi zagłodzić prądnicę.

      <p><b>Silniki.</b> W zakładce Maszyny wymienisz napęd. Parowy daje moment ×2,4 kosztem
      obrotów, turbina odwrotnie, spalinowy jest wyrównany i ma duży zapas mocy.
      Wybór silnika przesądza, jakie maszyny opłaca się trzymać razem.</p>
      <p><b>Trzy sposoby przeniesienia napędu.</b> Pasek jest tani, ale gubi 18% mocy.
      Łańcuch traci 7% i się nie ślizga, wymaga jednak kół 2x lub większych.
      Wał traci tylko 3%, ale blokuje całą linię, którą biegnie.</p>
      <p><b>Układy mocy.</b> Akumulator podnosi zapas mocy silnika, tłumik obniża pobór
      wszystkich maszyn. To one decydują, ile maszyn utrzymasz naraz, gdy sam silnik już nie starcza.</p>
      <p><b>Regulacja w locie.</b> Wariator przełączysz tapnięciem na ×0,5, ×1, ×2 lub ×3 —
      jedna część zastępuje pół zestawu przekładni, ale zjada 6% mocy. Sprzęgło odśrodkowe samo
      rozłącza gałąź powyżej progu, więc prądnica nie przekręci się, gdy rozpędzisz wiertło.</p>
      <p><b>Poziomy wykonania.</b> Stuknij część, a otworzy się panel z jej obrotami i momentem.
      Możesz ją ulepszyć do Mk2 i Mk3 — mniejsze straty, mniejszy pobór mocy, większy urobek
      maszyn. Ulepszona część ma kolorową obwódkę i kropki z boku.</p>
      <p><b>Sterowanie.</b> lewy przycisk = stuknięcie w silnik lub przeciąganie części ·
      prawy przycisk = zdejmij część · kółko = zoom · przeciąganie tła = przesuwanie.</p>`;
    body.appendChild(d);
    body.appendChild(mkBtn("← Wróć","pri",()=>renderMenu("main")));
    return;
  }
  if (view==="credits"){
    const d=document.createElement("div"); d.className="credits";
    d.innerHTML=`<h2>COGGER</h2>
      <p><span>Projekt i wykonanie</span><b>Dominik Owsiany</b></p>
      <p><span>Pomysłodawca</span><b>Paweł Owsiany</b></p>
      <hr><small>Symulator przekładni i wydobycia.<br>
      Zbudowany na HTML5 Canvas, bez zewnętrznych bibliotek.</small>`;
    body.appendChild(d);
    body.appendChild(mkBtn("← Wróć","pri",()=>renderMenu("main")));
    return;
  }
  if (view==="stats"){
    const rows=[["Zarobek przebiegu",fmt(S.earnedRun)+" zł"],["Rekord",fmt(Math.max(S.best,S.earnedRun))+" zł"],
      ["Surowiec w silosie",fmt(S.ore)+" / "+fmt(siloCap())],["Rdzenie",S.shards+" ⬢"],
      ["Szczyt RPM",Math.round(peakRpm)],
     ["Najgłębszy szyb",machNodes.reduce((a,m)=>Math.max(a,m.depth||0),0).toFixed(1)+" m"],
     ["Sektory / warstwy",S.sectors.length],
      ["Rury",S.pipes.length],["Maszyny",S.machines.length],
      ["Obciążenie","×"+machineLoad().toFixed(2)],["Zlecenia",S.msn+" / "+MISSIONS.length]];
    rows.forEach(r=>{
      const d=document.createElement("div"); d.className="stat";
      d.innerHTML=`<span>${r[0]}</span><b>${r[1]}</b>`; body.appendChild(d);
    });
    body.appendChild(document.createElement("br"));
    body.appendChild(mkBtn("← Wróć","pri",()=>renderMenu("main")));
    return;
  }
  body.appendChild(mkBtn("▶ Graj","pri",closeMenu));
  body.appendChild(mkBtn("? Jak grać","",()=>renderMenu("help")));
  body.appendChild(mkBtn("📊 Statystyki","",()=>renderMenu("stats")));
  body.appendChild(mkBtn("👥 Twórcy","",()=>renderMenu("credits")));
  body.appendChild(mkBtn("🎓 Powtórz samouczek","",()=>{ S.tut=0; closeMenu(); tutStart(); }));
  body.appendChild(mkBtn(S.muted?"🔇 Dźwięk wyłączony":"🔊 Dźwięk włączony","",
    ()=>{ S.muted=!S.muted; renderMenu("main"); }));
  let armed=false;
  const rb=mkBtn("↺ Reset postępu","dan",()=>{
    if (!armed){
      armed=true;
      rb.innerHTML="⚠ Na pewno? Kliknij ponownie<small>tego nie da się cofnąć</small>";
      rb.style.background="#7a2f38";
      setTimeout(()=>{ armed=false;
        rb.innerHTML="↺ Reset postępu"; rb.style.background=""; },4000);
      return;
    }
    hardReset();
  });
  body.appendChild(rb);
}

function hardReset(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  const muted=S?S.muted:false;
  S=freshState(); S.muted=muted;
  scanned.clear(); invalidateOffers();
  boost=0; peakRpm=0; goldFrac=0; jammed=false;
  cancelBelt(); pipeMode=false;
  parts.length=0; floats.length=0;
  startRun(); rebuild(); rebuildPipes();
  drawerTab=-1; el("drawer").style.display="none";
  tabBtns.forEach(b=>b.classList.remove("act"));
  wideView=false; fitCamera();
  closeMenu(); refreshHUD();
  toast("Postęp skasowany — nowa maszyna");
}

/* ════════════ ZAPIS ════════════ */

const KEY="cogger.v3"; let saveT=0;
function save(){
  try{ S.savedAt=Date.now(); S.lastRate=goldPerSec;
    S.scan=[...scanned]; localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(KEY); if (!raw) return false;
    const d=JSON.parse(raw); if (!d||!d.owned) return false;
    S=Object.assign(freshState(),d);
    const pad=(a,n)=>a.length<n?a.concat(new Array(n-a.length).fill(0)):a;
    S.owned=pad(S.owned,KINDS.length); S.ulvl=pad(S.ulvl,UPGRADES.length); S.perk=pad(S.perk,PERKS.length);
    ["machines","belts","shafts","chains","pipes","deposits","sectors","gears"].forEach(k=>{ if (!Array.isArray(S[k])) S[k]=[]; });
    if (!S.sectors.length) S.sectors=[{cx:0,cy:0,q:secQual(0,0),rev:1}];
    if (!S.res) S.res={}; if (S.rp===undefined) S.rp=0;
    applyRes();
    if (Array.isArray(d.scan)) d.scan.forEach(k=>scanned.add(k));
    const secs=Math.min((Date.now()-(d.savedAt||Date.now()))/1000,8*3600);
    const off=secs*(d.lastRate||0)*.5;
    if (off>1){ S.gold+=off; setTimeout(()=>toast("Offline: +"+fmt(off)+" zł"),500); }
    return true;
  }catch(e){ return false; }
}

/* ════════════ START ════════════ */

function startRun(){
  invalidateOffers();
  // sektor pod powierzchnią od razu w posiadaniu — inaczej nie ma czego wydobywać
  if (!owns(0,1)) S.sectors.push({cx:0,cy:1,q:secQual(0,1),rev:1});
  scanned.add("0,1");
  layoutBoard();

  if (S.machines.length===0){
    S.gold=Math.max(S.gold,250);
    S.owned[0]=4+2*S.perk[3];
    // korba y=2.0 (r 1.5) -> zębatka 1x na y=0 (dystans 2.0 = zazębienie)
    S.gears=[{id:S.nextId++,kind:0,x:0,y:0},{id:S.nextId++,kind:0,x:0,y:-1},
             {id:S.nextId++,kind:0,x:0,y:-2},{id:S.nextId++,kind:0,x:0,y:-3}];
    S.machines=[{id:S.nextId++,t:M_DRILL,x:0,y:-4}];   // przy samym dnie powierzchni
    S.pipes=[];
    for (let i=0;i<S.perk[4];i++) S.pipes.push({x:0,y:-4-i*PIPE.step});
    S.pipesBought=S.pipes.length;
    S.deposits=[{x:0,y:-3.9,amt:6000*QUAL[secQual(0,1)].m,max:6000*QUAL[secQual(0,1)].m,
                 cx:0,cy:1,q:secQual(0,1)}];
  }
  ensureDeposits();
  syncNodes(false); rebuild(); rebuildPipes(); fitCamera();
}

/* ════════════ PĘTLA ════════════ */

let last=performance.now(),uiT=0,autoT=0,msnT=0,mktT=0,scanT=0,booted=false;

function loop(now){
  let dt=(now-last)/1000; last=now;
  if (dt>.1) dt=.1;
  bgT+=dt; S.t+=dt; stepCam(dt);

  if (dirty){ const wj=jammed; rebuild();
    if (jammed&&!wj){ jamFlash=1; sfx.jam(); toast("⚠ Mechanizm zakleszczony"); } }
  if (pipeDirty) rebuildPipes();
  stepDrills(dt);

  const aps=S.ulvl[5]*.5;
  if (aps>0){ autoT+=dt; const iv=1/aps;
    while (autoT>=iv){ autoT-=iv;
      boost=Math.min(BOOST_MAX,boost+(UPGRADES[0].base+UPGRADES[0].per*S.ulvl[0])); punch=Math.max(punch,.5); } }
  if (comboT>0){ comboT-=dt*1.25; if (comboT<=0){ comboT=0; combo=0; } }

  boost*=Math.exp(-decayK()*dt);
  if (boost<.001) boost=0;

  const baseRpm=UPGRADES[1].base+UPGRADES[1].per*S.ulvl[1];
  // wspólny budżet mocy: maszyny konkurują o ten sam silnik
  const target=1+powerDraw/Math.max(.2,powerCap());
  loadSmooth+=(target-loadSmooth)*Math.min(1,dt*3.5);
  crankRpm=jammed?0:baseRpm*ENG().rpm*FX.rpm*(1+boost)/loadSmooth;
  crankTq=crankTorque()*ENG().tq*FX.tq;

  for (const n of nodes){
    if (n.spawn<1) n.spawn=Math.min(1,n.spawn+dt*4.5);
    if (n.hl>0) n.hl=Math.max(0,n.hl-dt*.5);
    n.rpm=0; n.torque=0; n.lim=1;
  }
  // regulatory ścinają obroty w swojej gałęzi; moc zamienia się w moment
  for (let i=0;i<bfsOrder.length;i++){
    const n=bfsOrder[i];
    let lim=n.par?n.par.lim:1;
    const raw=crankRpm*n.ratio*lim;
    if (KINDS[n.kind].gov&&n.ref){
      const t=n.ref.tgt===undefined?GOV_TARGETS[0]:n.ref.tgt;
      const a=Math.abs(raw);
      if (t>0&&a>t) lim*=t/a;
    }
    if (KINDS[n.kind].centri&&n.ref){
      const t=n.ref.tgt===undefined?900:n.ref.tgt;
      n.cut=Math.abs(raw)>t;
      if (n.cut) lim=0;                       // rozłączone przy nadobrotach
    }
    n.lim=lim;
    n.rpm=crankRpm*n.ratio*lim;
    n.torque=crankTq*n.tratio/lim;
  }
  // korba całkuje swobodnie, reszta jest zazębiona fazowo — zęby wchodzą w luki
  if (Math.abs(crank.rpm)>.0001) crank.angle+=crank.rpm*.10472*dt;
  for (let i=0;i<bfsOrder.length;i++){
    const n=bfsOrder[i], par=n.par;
    if (!par){ continue; }
    const sameLim=Math.abs(n.lim-par.lim)<1e-9;
    if (!n.freeSpin&&sameLim){
      const N1=Math.max(4,Math.round(driveOf(par)*16));
      const N2=Math.max(4,Math.round(pitchOf(n)*16));
      n.angle=n.phi+Math.PI-Math.PI/N2+(N1/N2)*(n.phi-par.angle);
    } else if (Math.abs(n.rpm)>.05){
      n.angle+=n.rpm*.10472*dt;
    }
  }
  for (const n of nodes) if (!n.powered&&Math.abs(n.rpm)>.05) n.angle+=n.rpm*.10472*dt;

  activeMach=Math.max(1,machNodes.filter(m=>m.powered).length);
  powerDraw=0;
  for (const m of machNodes){
    if (!m.powered) { m.draw=0; continue; }
    m.draw=Math.abs(m.rpm)*Math.abs(m.torque)/220*dampMul()*MK[mkOf(m)].draw;   // moc = obroty × moment
    powerDraw+=m.draw;
  }
  totalRpm=0; totalTq=0; orePerSec=0; goldPerSec=0;
  radarOK=false;

  for (const m of machNodes){
    totalRpm+=Math.abs(m.rpm); totalTq+=Math.abs(m.torque);
    const o=machineOutput(m);
    m.inc=o.gold; m.oreRate=o.ore;
    orePerSec+=Math.max(0,o.ore); goldPerSec+=o.gold;
    if (m.mt===M_RADAR&&m.powered&&Math.abs(Math.abs(m.rpm)-RADAR_RPM)<=RADAR_TOL) radarOK=true;
  }
  if (totalRpm>peakRpm) peakRpm=totalRpm;

  // wydobycie -> silos
  const cap=siloCap();
  for (const m of machNodes){
    if (!m.oreRate) continue;
    if (m.oreRate>0){
      const room=Math.max(0,cap-S.ore);
      const got=Math.min(m.oreRate*dt,room);
      S.ore+=got; S.rp=(S.rp||0)+got*.0022;
      const t=m.strata;
      if (t){
        t.res-=got;
        if (t.res<=0){ t.res=0; sfx.ping();
          toast("Warstwa "+QUAL[t.q].n+" wyczerpana — wierć głębiej"); }
      }
    } else S.ore=Math.max(0,S.ore+m.oreRate*dt);
  }
  if (S.autoSell){
    const AST=[0,1.15,1.35,1.6][S.autoSell]||0;
    const b=bestMerch();
    if (S.ore>=siloCap()*.25 && priceOf(b)/Math.max(.001,oreValue())>=AST) sellAll(b);
  }
  goldFrac+=goldPerSec*dt;
  if (goldFrac>=1){ const w=Math.floor(goldFrac); goldFrac-=w; earnGold(w); }

  // radar
  if (radarOK){
    scanT+=dt;
    if (scanT>6){
      scanT=0;
      const rn=machNodes.find(m=>m.mt===M_RADAR&&m.powered);
      let bestK=null,bestD=1e9;
      for (let dx=-2;dx<=2;dx++) for (let dy=0;dy<=4;dy++){
        const cx=Math.round((rn.x-SX0)/SW)+dx, cy=dy;
        const k=cx+","+cy;
        if (scanned.has(k)) continue;
        const d=Math.abs(dx)+dy;
        if (d<bestD){ bestD=d; bestK={cx,cy}; }
      }
      if (bestK){ revealSector(bestK.cx,bestK.cy); sfx.ping();
        toast("Zwiad: sektor "+bestK.cx+","+bestK.cy+" kryje żyłę "+QUAL[secQual(bestK.cx,bestK.cy)].n); }
    }
  } else scanT=Math.max(0,scanT-dt*.5);

  // efekty
  floatT+=dt;
  if (orePerSec>.3&&floatT>.7&&machNodes.length){
    floatT=0;
    const m=machNodes.find(x=>x.oreRate>0);
    if (m) spawnFloat(Math.min(W-46,Math.max(46,sx(m.x)+scale*1.15)),
                      Math.max(70,sy(m.y)-scale*.4),"+"+fmt(m.oreRate*.7),"#8fd6ff");
  }
  punch=Math.max(0,punch-dt*6); shake=Math.max(0,shake-dt*3);
  jamFlash=Math.max(0,jamFlash-dt*2); critFlash=Math.max(0,critFlash-dt*3);
  for (let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life-=dt*(p.g<.15?.55:1.7);
    if (p.life<=0||p.y>H+60) parts.splice(i,1);
  }
  for (let i=floats.length-1;i>=0;i--){
    const f=floats[i]; f.y-=45*dt; f.life-=dt*.95;
    if (f.life<=0) floats.splice(i,1);
  }

  // giełda: próbkowanie 5 Hz
  mktT+=dt;
  if (mktT>.2){
    mktT=0;
    for (let i=0;i<MERCH.length;i++){
      if (histN<HIST) hist[i][histN]=merchPrice(i,S.t);
      else { hist[i].copyWithin(0,1); hist[i][HIST-1]=merchPrice(i,S.t); }
    }
    if (histN<HIST) histN++;
    drawMarket();
  }

  sfx.update(totalRpm,totalRpm>1&&!jammed);
  draw();

  if (!booted){ booted=true;
    const b=document.getElementById("boot"); if (b) b.style.display="none"; }
  tutTick(dt);
  metricsTick();
  msnT+=dt; if (msnT>.5){ msnT=0; checkMissions(); }
  saveT+=dt; if (saveT>5){ saveT=0; save(); }
  uiT+=dt;  if (uiT>.12){ uiT=0; refreshHUD(); }

  requestAnimationFrame(loop);
}

addEventListener("error",ev=>{ try{ toast("Błąd: "+ev.message); }catch(e){} });
addEventListener("visibilitychange",()=>{ if (document.hidden) save(); });

const hadSave=load();
if (!hadSave) S=freshState();
resize();
if (S.machines.length===0) startRun();
else { layoutBoard(); ensureDeposits(); syncNodes(false); fitCamera(); }
applyRes();
rebuild(); rebuildPipes(); checkUnlocks(); refreshHUD(); syncTools();
el("muteBtn").textContent=S.muted?"🔇":"🔊";
if (!hadSave){ openMenu("main"); S.tut=0; }
if ((S.tut||0)<TUT.length) tutStart(); else el("tut").style.display="none";
requestAnimationFrame(loop);

</script></body></html>
