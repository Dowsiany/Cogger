<script>
(function(){
  function fail(m){
    var b=document.getElementById("boot");
    if(!b) return;
    b.className="err";
    document.getElementById("bootMsg").textContent=
      "Nie udało się uruchomić gry.\n\n"+m+"\n\nPrześlij mi tę treść.";
  }
  var shown={};
  window.addEventListener("error",function(e){
    var m=(e.message||"błąd")+" (linia "+(e.lineno||"?")+")";
    var boot=document.getElementById("boot");
    if (boot&&boot.style.display!=="none"){ fail(m); return; }
    if (shown[m]) return; shown[m]=1;                 // każdy błąd raz na sesję
    var t=document.getElementById("toasts");
    if (!t) return;
    var d=document.createElement("div");
    d.className="toast";
    d.style.borderColor="#a34"; d.style.color="#ff9aab";
    d.textContent="Błąd: "+m;
    t.appendChild(d);
    setTimeout(function(){ d.remove(); },7000);
  });
  window.addEventListener("unhandledrejection",function(e){ fail("Promise: "+e.reason); });
  window.__gameFail=fail;
})();
</script>

const SPR={}; let sprLeft=Object.keys(SPR_SRC).length, sprReady=false;
if (typeof Image!=="undefined"){
  for (const k in SPR_SRC){
    const im=new Image();
    im.onload=im.onerror=()=>{ if (--sprLeft<=0) sprReady=true; };
    im.src=SPR_SRC[k]; SPR[k]=im;
  }
}
const tintCache=new Map();
function tinted(name,color){
  const key=name+"|"+color;
  let c=tintCache.get(key); if (c) return c;
  const img=SPR[name]; if (!img||!img.width) return null;
  c=document.createElement("canvas"); c.width=img.width; c.height=img.height;
  const x=c.getContext("2d");
  x.drawImage(img,0,0);
  x.globalCompositeOperation="multiply"; x.fillStyle=color; x.fillRect(0,0,c.width,c.height);
  x.globalCompositeOperation="destination-in"; x.drawImage(img,0,0);
  if (tintCache.size>140) tintCache.clear();
  tintCache.set(key,c); return c;
}
function gearSprite(kind){
  const k=KINDS[kind];
  if (k.art) return k.art;
  if (k.perfect) return "g_bearing";
  return k.teeth<=8?"g_1x":k.teeth<=16?"g_2x":"g_3x";
}

function resLocked(nd){
  if (nd.x&&R(nd.x)) return "wyklucza się z: "+(RESEARCH.find(z=>z.id===nd.x)||{}).n;
  for (const q of nd.r) if (!R(q)) return "wymaga: "+(RESEARCH.find(z=>z.id===q)||{}).n;
  return null;
}
function buyRes(nd){
  if (R(nd.id)) return;
  const lock=resLocked(nd);
  if (lock) return say(lock);
  if ((S.rp||0)<nd.c) return say("Brakuje punktów badań");
  S.rp-=nd.c; S.res[nd.id]=1; applyRes(); dirty=true;
  sfx.prestige(); toast("Zbadano: "+nd.n); renderDrawer();
}

const mkOf   =n=>(n&&n.ref&&n.ref.lvl)||0;
const mkCost =n=>{
  const base=n.role==="mach"?MACHINES[n.mt].cost:KINDS[n.kind].cost;
  return Math.round(base*(mkOf(n)===0?2.6:8.5));
};
function upgradePart(n){
  if (!n||!n.ref) return;
  const lvl=mkOf(n);
  if (lvl>=2) return say("To już najwyższy poziom");
  const c=mkCost(n);
  if (S.gold<c) return say("Ulepszenie kosztuje "+fmt(c)+" zł");
  snapshot();
  S.gold-=c; n.ref.lvl=lvl+1; dirty=true;
  sfx.buy(); toast((n.role==="mach"?MACHINES[n.mt].label:KINDS[n.kind].name)+" → "+MK[lvl+1].n);
}

const rockCache=new Map();
function rocksOf(t){
  const k=t.cx+","+t.cy;
  let r=rockCache.get(k); if (r) return r;
  r=[];
  if (t.cy>0){
    let h=((t.cx*668265263)^(t.cy*374761393)^0x27d4eb2f)>>>0;
    const rnd=()=>{ h=(h*1664525+1013904223)>>>0; return h/4294967296; };
    const n=1+Math.min(3,Math.floor(t.cy/2)+(rnd()<.5?1:0));
    for (let i=0;i<n;i++){
      const rad=.38+rnd()*.42;
      r.push({x:secX0(t.cx)+rad+.5+rnd()*(SW-2*rad-1),
              y:secY0(t.cy)-SH+rad+.5+rnd()*(SH-2*rad-1), r:rad});
    }
  }
  rockCache.set(k,r); return r;
}
function rockAt(x,y){
  for (const t of S.sectors)
    for (const b of rocksOf(t))
      if (Math.hypot(x-b.x,y-b.y)<b.r) return b;
  return null;
}
const ROCK_MULT=2.8;                     // ile razy trudniej przebić lity blok

function rockBlocks(x,y,pitch){
  for (const t of S.sectors)
    for (const b of rocksOf(t))
      if (Math.hypot(x-b.x,y-b.y)<b.r+pitch*.85) return true;
  return false;
}

 {n:"Uboga",m:1.0,c:"#7d8798"},{n:"Zwykła",m:1.7,c:"#9ab8d9"},
 {n:"Bogata",m:2.8,c:"#6edca0"},{n:"Wyjątkowa",m:4.5,c:"#ffd166"},
];
function secQual(cx,cy){
  let h=(cx*73856093)^(cy*19349663)^0x9e3779b9;
  h=(h^(h>>>13))>>>0; h=(h*1274126177)>>>0;
  const r=(h>>>8)%100;
  const deep=Math.min(3,Math.max(0,cy));           // głębiej = bogaciej
  return Math.min(3,(r<40?0:r<72?1:r<92?2:3)+ (deep>1?1:0));
}
const secX0=cx=>SX0+cx*SW;
const secY0=cy=>SY0-cy*SH;                          // cy rośnie w dół
const owns=(cx,cy)=>S.sectors.some(t=>t.cx===cx&&t.cy===cy);
const sectorOf=(x,y)=>({cx:Math.floor((x-SX0)/SW),cy:Math.floor((SY0-y)/SH)});
const secRec=(cx,cy)=>S.sectors.find(t=>t.cx===cx&&t.cy===cy);

const G={minX:-1.6,maxX:1.6,minY:-3,maxY:0,crankY:2.0};
function layoutBoard(){
  let a=1e9,b=-1e9,c=1e9,d=-1e9;
  for (const t of S.sectors){
    a=Math.min(a,secX0(t.cx)); b=Math.max(b,secX0(t.cx)+SW);
    c=Math.min(c,secY0(t.cy)-SH); d=Math.max(d,secY0(t.cy));
  }
  if (a>b){ a=SX0;b=SX0+SW;c=SY0-SH;d=SY0; }
  G.minX=a; G.maxX=b; G.minY=c; G.maxY=d;
}
function inBoard(x,y){ const s0=sectorOf(x,y); return owns(s0.cx,s0.cy); }

const perkDisc  =()=>Math.pow(.92,S.perk[1]);
const sectorCost=(cx,cy)=>Math.round(450*Math.pow(2.9,S.sectors.length-1)*
  (1+.55*Math.abs(cx)+.12*Math.abs(cy))*perkDisc()*FX.sector);   // w dół taniej niż w bok
const sectorMult=()=>{ let a=0; for (let i=1;i<S.sectors.length;i++) a+=1+S.sectors[i].q; return 1+.12*a; };
const prestMult =()=>1+.2*S.perk[0];
const oreMult   =()=>Math.pow(1.10,S.ulvl[3]);
const totalMult =()=>sectorMult()*prestMult()*oreMult();
const loadFactor=()=>LOAD_BASE*Math.pow(.93,S.ulvl[7])*Math.pow(.92,S.perk[2]);
const ENG=()=>ENGINES[S.engine||0];
const accuCount=()=>nodes.reduce((a,n)=>a+((n.powered&&KINDS[n.kind].accu)?1:0),0);
const dampCount=()=>nodes.reduce((a,n)=>a+((n.powered&&KINDS[n.kind].damp)?1:0),0);
const powerCap =()=>(ENG().cap*Math.pow(1.12,S.ulvl[7])+.9*accuCount())*FX.cap;
const dampMul  =()=>Math.pow(.88,dampCount())*FX.draw;
let powerDraw=0, loadSmooth=1;
const machineLoad=()=>loadSmooth;
const crankTorque=()=>Math.pow(1.25,S.ulvl[6]);
const linkEff   =()=>1-BASE_LOSS*FX.loss*Math.pow(.85,S.ulvl[2]);
const beltEff   =(a,b)=>{
  const pl=(a&&KINDS[a.kind].pulley)||(b&&KINDS[b.kind].pulley);
  return 1-(pl?.06:BELT.loss)*Math.pow(.85,S.ulvl[2]);
};
const flyCount  =()=>S.gears.reduce((a,g)=>a+(KINDS[g.kind].fly?1:0),0);
const decayK    =()=>FRICTION_K*Math.pow(.85,flyCount())*FX.decay;
const hoistCount=()=>nodes.reduce((a,n)=>a+((n.powered&&KINDS[n.kind].hoist)?1:0),0);
const siloCap   =()=>Math.round(800*Math.pow(1.8,S.ulvl[8])*(1+.4*hoistCount())*FX.silo);
const pumpRate  =()=>PUMP_RATE*Math.pow(1.25,S.ulvl[9]);
const gearCost  =k=>KINDS[k].cost*Math.pow(1.17,S.owned[k])*(KINDS[k].grp===1?FX.pcost:1);
const upCost    =i=>UPGRADES[i].cost*Math.pow(UPGRADES[i].growth,S.ulvl[i]);
const placedG   =k=>S.gears.reduce((a,g)=>a+(g.kind===k?1:0),0);
const freeOf    =k=>S.owned[k]-placedG(k);
const perkCost  =i=>Math.ceil(PERKS[i].base*Math.pow(1.6,S.perk[i]));
const machCount =t=>S.machines.reduce((a,m)=>a+(m.t===t?1:0),0);
const machCost  =t=>MACHINES[t].cost*Math.pow(MACHINES[t].growth,machCount(t));
const beltCost  =()=>BELT.cost*Math.pow(BELT.growth,S.beltsBought);
const shaftCost =()=>SHAFT.cost*Math.pow(SHAFT.growth,S.shaftsBought);
const chainCost =()=>CHAIN.cost*Math.pow(CHAIN.growth,S.chainsBought);
const pipeCost  =()=>PIPE.cost*Math.pow(PIPE.growth,S.pipesBought);
const unlocked  =k=>{ const r=KINDS[k].req; return !r||S.sectors.length>=r.sec; };

const MERCH=[
 {n:"Huta Wschód", c:"#ffd166", base:1.00, w:[.105,.041], a:[.26,.15], ph:[0,1.7]},
 {n:"Port Zachód", c:"#5ec8e8", base:0.92, w:[.068,.027], a:[.36,.19], ph:[2.1,.4]},
 {n:"Kartel Płd.", c:"#c76bb8", base:1.14, w:[.047,.093], a:[.21,.30], ph:[1.1,3.0]},
];
const HIST=170;
const hist=MERCH.map(()=>new Float32Array(HIST));
let histN=0, histT=0;

function merchPrice(i,t){
  const m=MERCH[i];
  let v=1;
  for (let k=0;k<m.w.length;k++) v+=m.a[k]*Math.sin(m.w[k]*t+m.ph[k]);
  return Math.max(.18,m.base*v);
}
const millCount=()=>machNodes.reduce((a,m)=>a+((m.powered&&m.mt===M_MILL&&Math.abs(m.rpm)>60)?1:0),0);
const oreValue=()=>.6*totalMult()*(1+.25*millCount())*FX.price;
const priceOf=i=>merchPrice(i,S.t)*oreValue();
function bestMerch(){
  let b=0; for (let i=1;i<MERCH.length;i++) if (priceOf(i)>priceOf(b)) b=i;
  return b;
}
function sellAll(i){
  if (S.ore<=0) return say("Silos pusty");
  const v=S.ore*priceOf(i);
  earnGold(v); S.ore=0;
  sfx.sell(); toast("Sprzedano za "+fmt(v)+" zł u: "+MERCH[i].n);

}
const LOAN_CUT=.35;                          // ile z każdego dochodu idzie na spłatę długu
function earnGold(v){
  if (v>0&&S.debt>0){
    const cut=Math.min(S.debt,v*LOAN_CUT);
    S.debt-=cut; v-=cut;
  }
  S.gold+=v; S.earnedRun+=v;
}
const LOANS=[
  {label:"Mała pożyczka",  rate:.10, mult:.6, col:"#5fae7a"},
  {label:"Średnia pożyczka",rate:.25, mult:1.5,col:"#c9a24a"},
  {label:"Duża pożyczka",  rate:.50, mult:4,  col:"#c9668a"},
];
function loanBase(){
  const o=offers()[0];
  return o?o.cost:Math.max(500,S.gold*.5+500);
}
function loanAmount(i){ return Math.round(loanBase()*LOANS[i].mult/10)*10; }
function takeLoan(i){
  if (S.debt>0) return say("Najpierw spłać poprzednią pożyczkę");
  const amt=loanAmount(i);
  S.gold+=amt; S.debt=Math.round(amt*(1+LOANS[i].rate));
  sfx.buy(); toast("Pożyczka: +"+fmt(amt)+" zł · do spłaty "+fmt(S.debt)+" zł");
  refreshDrawer();
}
function repayDebt(){
  if (S.debt<=0) return;
  const pay=Math.min(S.gold,S.debt);
  if (pay<=0) return say("Brak złota na spłatę");
  S.gold-=pay; S.debt-=pay;
  sfx.sell(); toast(S.debt<=0?"Pożyczka spłacona!":("Spłacono "+fmt(pay)+" zł · pozostało "+fmt(S.debt)+" zł"));
  refreshDrawer();
}

/* ════════════ GRAF (rdzeń — bez zmian) ════════════ */

function mkNode(kind,x,y,role,ref,mt,id){
  return {kind,x,y,role:role||null,ref:ref||null,mt:mt===undefined?-1:mt,id:id||0,
          ratio:0,tratio:0,powered:false,angle:0,visit:-1,nb:[],spawn:ref?0:1,hl:0,
          rpm:0,torque:0,inc:0};
}
function syncNodes(keep){
  const old=new Map();
  if (keep) for (const n of nodes) if (n.ref) old.set(n.ref,n);
  crank=mkNode(2,0,G.crankY,"crank",null,-1,0);
  nodes=[crank]; machNodes=[]; byId=new Map(); byId.set(0,crank);
  for (const m of S.machines){
    if (!m.id) m.id=S.nextId++;
    const n=mkNode(MACHINES[m.t].kind,m.x,m.y,"mach",m,m.t,m.id);
    const p=old.get(m); if (p){ n.angle=p.angle; n.spawn=p.spawn; }
    nodes.push(n); machNodes.push(n); byId.set(m.id,n);
  }
  for (const g of S.gears){
    if (!g.id) g.id=S.nextId++;
    const n=mkNode(g.kind,g.x,g.y,null,g,-1,g.id);
    const p=old.get(g); if (p){ n.angle=p.angle; n.spawn=p.spawn; }
    nodes.push(n); byId.set(g.id,n);
  }
  S.belts=S.belts.filter(b=>byId.has(b.a)&&byId.has(b.b));
  if (!Array.isArray(S.shafts)) S.shafts=[];
  S.shafts=S.shafts.filter(b=>byId.has(b.a)&&byId.has(b.b));
  if (!Array.isArray(S.chains)) S.chains=[];
  S.chains=S.chains.filter(b=>byId.has(b.a)&&byId.has(b.b));
  dirty=true; pipeDirty=true;
}
const VARI_K=[.5,1,2,3];
const pitchOf=n=>KINDS[n.kind].pitch;
const driveOf=n=>KINDS[n.kind].vari&&n.ref
  ? KINDS[n.kind].drive*(n.ref.k===undefined?1:n.ref.k)
  : KINDS[n.kind].drive;

function posFree(x,y,pitch,ignore){
  for (const n of nodes){
    if (n===ignore) continue;
    if (Math.hypot(x-n.x,y-n.y)<pitch+pitchOf(n)-MESH_TOL) return false;
  }
  if (rockBlocks(x,y,pitch)) return false;
  for (const sh of S.shafts){
    const a=byId.get(sh.a),b=byId.get(sh.b);
    if (!a||!b||a===ignore||b===ignore) continue;
    const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1;
    let t=((x-a.x)*dx+(y-a.y)*dy)/L2; t=Math.max(.12,Math.min(.88,t));
    if (Math.hypot(x-(a.x+dx*t),y-(a.y+dy*t))<pitch*.85) return false;
  }
  return true;
}

function rebuild(){
  jammed=false; contacts.length=0;
  for (const n of nodes){ n.ratio=0; n.tratio=0; n.powered=false; n.nb.length=0;
    n.par=null; n.lim=1; n.phi=0; n.freeSpin=true; }

  for (let i=0;i<nodes.length;i++)
    for (let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];
      const d=Math.hypot(a.x-b.x,a.y-b.y), ideal=pitchOf(a)+pitchOf(b);
      if (Math.abs(d-ideal)<=MESH_TOL){
        a.nb.push({n:b,belt:0}); b.nb.push({n:a,belt:0});
        const t=pitchOf(a)/ideal;
        contacts.push({a,x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
      }
    }
  for (const bl of S.belts){
    const a=byId.get(bl.a),b=byId.get(bl.b);
    if (!a||!b) continue;
    a.nb.push({n:b,belt:1}); b.nb.push({n:a,belt:1});
  }
  for (const sh of S.shafts){
    const a=byId.get(sh.a),b=byId.get(sh.b);
    if (!a||!b) continue;
    a.nb.push({n:b,belt:1,shaft:1}); b.nb.push({n:a,belt:1,shaft:1});
  }
  for (const ch of S.chains){
    const a=byId.get(ch.a),b=byId.get(ch.b);
    if (!a||!b) continue;
    a.nb.push({n:b,belt:1,chain:1}); b.nb.push({n:a,belt:1,chain:1});
  }

  stampN++;
  const f=Math.sqrt(linkEff());
  crank.ratio=1; crank.tratio=1; crank.powered=true; crank.visit=stampN;
  const q=[crank];
  for (let h=0;h<q.length;h++){
    const cur=q[h];
    if (KINDS[cur.kind].clutch && cur.ref && cur.ref.off) continue;
    for (const link of cur.nb){
      const nx=link.n;
      const perfect=KINDS[cur.kind].perfect||KINDS[nx.kind].perfect;
      const variLoss=KINDS[cur.kind].vari?.94:1;
      const e0=link.chain?Math.sqrt(1-CHAIN.loss)
             :link.shaft?Math.sqrt(1-SHAFT.loss)
             :link.belt?Math.sqrt(beltEff(cur,nx)):(perfect?1:f);
      const mkLoss=Math.min(MK[mkOf(cur)].loss,MK[mkOf(nx)].loss);
      const e=1-(1-e0)*mkLoss;                 // lepsze wykonanie = mniejsze straty
      const sign=link.belt?1:-1;
      const rr=sign*cur.ratio*(driveOf(cur)/pitchOf(nx))*e*variLoss;
      const tr=cur.tratio*(pitchOf(nx)/driveOf(cur))*e*variLoss;
      if (nx.visit===stampN){
        const oneWay=KINDS[cur.kind].ratchet||KINDS[nx.kind].ratchet;
        if (nx.ratio*rr<0 && !oneWay) jammed=true;
        continue;
      }
      nx.visit=stampN; nx.ratio=rr; nx.tratio=tr; nx.powered=true; nx.par=cur;
      nx.phi=Math.atan2(nx.y-cur.y,nx.x-cur.x);      // kąt linii środków
      nx.freeSpin=!!link.belt;                        // pasek/wał nie wymusza fazy
      q.push(nx);
    }
  }
  bfsOrder=q;
  dirty=false;
}

/* ════════════ RUROCIĄGI ════════════ */

/* wiertło samo drąży: obroty dają tempo, moment przebija twardość skały */
function stepDrills(dt){
  for (const m of machNodes){
    if (m.mt!==M_DRILL&&m.mt!==M_CRUSH) continue;
    if (m.depth===undefined) m.depth=m.ref.depth||0;
    const rpm=Math.abs(m.rpm), tq=Math.abs(m.torque);
    const here=strataAt(m.x,m.y-m.depth);
    m.strata=here;
    const next=strataAt(m.x,m.y-m.depth-.35);
    m.need=hardness(next?next.cy:(here?here.cy:0));
    m.inRock=!!rockAt(m.x,m.y-m.depth-.25);
    if (m.inRock) m.need*=1+(ROCK_MULT-1)*FX.rock;     // wiertło ugrzęzło w litym bloku
    m.tqOk=tq>=m.need;
    m.atBottom=!next;                       // dalej nie ma wykupionego terenu
    const power=(m.mt===M_DRILL)? rpm/60 : Math.max(rpm/60*.35,tq*.25);
    const factor=Math.min(1,tq/Math.max(.01,m.need));
    if (m.powered&&!jammed&&next&&factor>.001)
      m.depth=Math.min(m.depth+power*factor*DRILL_SPEED*FX.drill*dt, m.y-G.minY-.4);
    m.ref.depth=m.depth;
  }
}

function rebuildPipes(){
  for (const m of machNodes) m.dep=null;
  if (!S.pipes.length){ pipeDirty=false; return; }

  const P=S.pipes;
  const adj=P.map(()=>[]);
  for (let i=0;i<P.length;i++)
    for (let j=i+1;j<P.length;j++)
      if (Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y)<=PIPE.step+.06){ adj[i].push(j); adj[j].push(i); }

  for (const m of machNodes){
    if (true) continue;                    // rurociągi zastąpione drążeniem
    const seen=new Array(P.length).fill(false);
    const q=[];
    for (let i=0;i<P.length;i++)
      if (Math.hypot(P[i].x-m.x,P[i].y-m.y)<=pitchOf(m)+.55){ seen[i]=true; q.push(i); }
    let found=null;
    for (let h=0;h<q.length&&!found;h++){
      const i=q[h];
      for (const d of S.deposits)
        if (d.amt>0&&Math.hypot(d.x-P[i].x,d.y-P[i].y)<=.7){ found=d; break; }
      for (const j of adj[i]) if (!seen[j]){ seen[j]=true; q.push(j); }
    }
    m.dep=found;
  }
  pipeDirty=false;
}

function pipeAt(x,y){
  for (let i=S.pipes.length-1;i>=0;i--)
    if (Math.hypot(S.pipes[i].x-x,S.pipes[i].y-y)<.26) return i;
  return -1;
}
function placePipe(x,y){
  const gx=Math.round(x/PIPE.step)*PIPE.step, gy=Math.round(y/PIPE.step)*PIPE.step;
  const ex=pipeAt(gx,gy);
  if (ex>=0){ S.pipes.splice(ex,1); S.pipesBought=Math.max(0,S.pipesBought-1);
    S.gold+=pipeCost()*.5; pipeDirty=true; dirty=true; sfx.remove(); return; }
  if (!inBoard(gx,gy)) return say("Poza wykupionym terenem");
  const c=pipeCost();
  if (S.gold<c) return say("Rura kosztuje "+fmt(c)+" zł");
  for (const n of nodes) if (Math.hypot(n.x-gx,n.y-gy)<pitchOf(n)+.28)
    return say("Zajęte przez zębatkę");
  S.gold-=c; S.pipesBought++;
  S.pipes.push({x:gx,y:gy});
  pipeDirty=true; dirty=true; sfx.place();
}

/* ════════════ ŻYŁY ════════════ */

function depositAt(x,y){
  for (const d of S.deposits) if (Math.hypot(d.x-x,d.y-y)<.45) return d;
  return null;
}
function spawnDepositIn(cx,cy,q){
  const x0=secX0(cx)+.55, y0=secY0(cy)-SH+.55;
  for (let t=0;t<60;t++){
    const x=x0+Math.random()*(SW-1.1), y=y0+Math.random()*(SH-1.1);
    let ok=true;
    for (const d of S.deposits) if (Math.hypot(d.x-x,d.y-y)<1.1){ ok=false; break; }
    if (Math.hypot(x,y-G.crankY)<2.6) ok=false;        // nie pod silnikiem
    if (!ok&&t<50) continue;
    S.deposits.push({x,y,amt:6000*QUAL[q].m,max:6000*QUAL[q].m,cx,cy,q});
    return;
  }
}
function ensureDeposits(){
  for (const t of S.sectors){
    t.rev=1;
    scanned.add(t.cx+","+t.cy);
    if (t.resMax===undefined){ t.resMax=reserveOf(t); t.res=t.resMax; }
  }
  S.deposits.length=0;                         // punktowe żyły zastąpione warstwami
}
/* warstwa pod danym punktem — null, jeśli to nie Twój teren */
function strataAt(x,y){
  const c=sectorOf(x,y);
  return S.sectors.find(t=>t.cx===c.cx&&t.cy===c.cy)||null;
}

/* ════════════ SEKTORY ════════════ */

let offersCache=null;
const invalidateOffers=()=>{ offersCache=null; };
function offers(){
  if (offersCache) return offersCache;
  const out=[],seen=new Set();
  for (const t of S.sectors)
    for (const d of [[1,0],[-1,0],[0,1],[0,-1]]){
      const cx=t.cx+d[0],cy=t.cy+d[1];
      if (cy<0||owns(cx,cy)) continue;
      const k=cx+","+cy;
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({cx,cy,q:secQual(cx,cy),cost:sectorCost(cx,cy),scanned:scanned.has(k)});
    }
  out.sort((a,b)=>a.cost-b.cost);
  offersCache=out;
  return out;
}
const scanned=new Set();

function buySector(cx,cy){
  const c=sectorCost(cx,cy);
  if (S.gold<c) return say("Sektor kosztuje "+fmt(c)+" zł");
  const q=secQual(cx,cy);
  trackRepeat("sector_bought",{glebia:cy,jakosc:QUAL[q].n});
  S.gold-=c; S.sectors.push({cx,cy,q,rev:1}); invalidateOffers();
  scanned.add(cx+","+cy);
  layoutBoard(); ensureDeposits();
  syncNodes(true); fitCamera();
  shake=1.1; confetti(); sfx.board();
  toast("Sektor wykupiony · żyła "+QUAL[q].n+" · zasób ×"+QUAL[q].m.toFixed(1));
  checkUnlocks(); if (drawerTab===T_MAP) renderDrawer();
}

function revealSector(cx,cy){
  scanned.add(cx+","+cy); invalidateOffers();
  const t=secRec(cx,cy);
  if (t&&!t.rev){ t.rev=1; ensureDeposits(); }
}

function machineOutput(n){
  if (!n.powered||jammed) return {ore:0,gold:0};
  const rpm=Math.abs(n.rpm), tq=Math.abs(n.torque);
  if (n.mt===M_DRILL||n.mt===M_CRUSH){
    const t=n.strata;
    if (!t||t.res<=0) return {ore:0,gold:0};
    let r=(n.mt===M_DRILL)? rpm/60*ORE_RATE*1.1
                          : tq*(rpm>CRUSH_LIMIT?CRUSH_LIMIT/rpm:1)*ORE_RATE*8*FX.crush;
    r*=oreMult()*FX.ore*QUAL[t.q].m*(1+t.cy*.45*FX.depth)*MK[mkOf(n)].out;
    return {ore:r,gold:0};
  }
  if (n.mt===M_GEN){
    const e=Math.exp(-.5*Math.pow((rpm-GEN_TARGET)/(GEN_TARGET*.5),2));
    return {ore:0,gold:GEN_GOLD*e*totalMult()*.35};
  }
  if (n.mt===M_PUMP){
    const cap=Math.min(S.ore, rpm/60*pumpRate());
    return {ore:-cap,gold:cap*priceOf(bestMerch())*.85};
  }
  return {ore:0,gold:0};
}

function findFreeSpot(pitch,surfaceOnly){
  const step=.25;
  for (let y=G.maxY-.15;y>=G.minY+.15;y-=step)
    for (let x=G.minX+.15;x<=G.maxX-.15;x+=step){
      if (surfaceOnly&&sectorOf(x,y).cy!==0) continue;
      if (inBoard(x,y)&&posFree(x,y,pitch,null)) return {x,y};
    }
  return null;
}
/* co się podepnie, gdy upuszczę część w tym miejscu */
function connectPreview(node,x,y){
  const out={hosts:[],rpm:0,tq:0,powered:false,jam:false};
  const eff=Math.sqrt(linkEff());
  let bestAbs=-1;
  for (const o of nodes){
    if (o===node) continue;
    const ideal=pitchOf(node)+pitchOf(o);
    if (Math.abs(Math.hypot(x-o.x,y-o.y)-ideal)>MESH_TOL) continue;
    const powered=o.powered&&!(KINDS[o.kind].clutch&&o.ref&&o.ref.off);
    const rr=powered? -o.ratio*(driveOf(o)/pitchOf(node))*eff : 0;
    const tr=powered?  o.tratio*(pitchOf(node)/driveOf(o))*eff : 0;
    out.hosts.push({n:o,rr,tr,powered});
    if (powered){
      out.powered=true;
      if (Math.abs(rr)>bestAbs){ bestAbs=Math.abs(rr); out.rpm=crankRpm*rr; out.tq=crankTq*tr; }
    }
  }
  const dr=out.hosts.filter(h=>h.powered);
  for (let i=1;i<dr.length;i++) if (dr[i].rr*dr[0].rr<0) out.jam=true;
  return out;
}

function drawConnectPreview(){
  if (!drag.n) return;
  const pos=snapPrev?{x:snapPrev.x,y:snapPrev.y}:{x:drag.n.x,y:drag.n.y};
  const info=connectPreview(drag.n,pos.x,pos.y);
  const gx=sx(pos.x),gy=sy(pos.y),gr=pitchOf(drag.n)*scale;
  const col=info.jam?"#ff8a7a":info.powered?"#6edca0":"#8aa0bd";

  ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.arc(gx,gy,gr,0,Math.PI*2);
  ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.stroke();
  ctx.setLineDash([]);

  for (const h of info.hosts){
    const hx=sx(h.n.x),hy=sy(h.n.y);
    ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(hx,hy);
    ctx.strokeStyle=h.powered?"rgba(110,220,160,.75)":"rgba(140,165,195,.4)";
    ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.arc(hx,hy,pitchOf(h.n)*scale*1.12,0,Math.PI*2);
    ctx.strokeStyle=h.powered?"rgba(110,220,160,.5)":"rgba(140,165,195,.25)";
    ctx.lineWidth=2; ctx.stroke();
  }

  const fs=Math.max(10,Math.min(15,scale*.26));
  ctx.font="800 "+fs+"px sans-serif"; ctx.textAlign="center";
  let txt;
  if (info.jam) txt="\u26a0 zakleszczenie";
  else if (!info.hosts.length) txt="brak styku";
  else if (!info.powered) txt="styk, ale bez napędu";
  else txt=Math.round(Math.abs(info.rpm))+" RPM \u00b7 \u21bb"+Math.abs(info.tq).toFixed(1)+
           " \u00b7 "+(info.rpm<0?"w prawo":"w lewo");
  const w=ctx.measureText(txt).width+14, ty=gy-gr-fs*1.1;
  ctx.fillStyle="rgba(9,13,19,.9)";
  if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(gx-w/2,ty-fs,w,fs*1.5,fs*.55); ctx.fill(); }
  else ctx.fillRect(gx-w/2,ty-fs,w,fs*1.5);
  ctx.fillStyle=col; ctx.fillText(txt,gx,ty+fs*.25);
}

function snapFor(node,px,py){
  let best=null,bestErr=1e9;
  for (const o of nodes){
    if (o===node) continue;
    const ideal=pitchOf(node)+pitchOf(o);
    const d=Math.hypot(px-o.x,py-o.y)||1e-6;
    const err=Math.abs(d-ideal);
    if (err>SNAP||err>=bestErr) continue;
    const x=o.x+(px-o.x)/d*ideal, y=o.y+(py-o.y)/d*ideal;
    if (!inBoard(x,y)||!posFree(x,y,pitchOf(node),node)) continue;
    if (node.role==="mach"&&sectorOf(x,y).cy!==0) continue;
    best={x,y,host:o}; bestErr=err;
  }
  return best;
}

function tapGear(k){
  snapshot();
  if (!unlocked(k)) return;
  if (freeOf(k)<=0){
    const c=gearCost(k);
    if (S.gold<c) return say("Za mało złota");
    S.gold-=c; S.owned[k]++; sfx.buy();
  }
  const peg=findFreeSpot(KINDS[k].pitch,false);
  if (!peg) return say("Brak miejsca — wykup sektor");
  const ng={id:S.nextId++,kind:k,x:peg.x,y:peg.y};
  S.gears.push(ng);
  syncNodes(true);
  const nn=byId.get(ng.id); if (nn) nn.hl=1;
  sfx.place(); refreshDrawer();
  say(KINDS[k].name+" postawiona — przeciągnij ją myszą na miejsce");
}

  rmNode=n;
  const isM=n.role==="mach";
  const nm=isM?MACHINES[n.mt].label:KINDS[n.kind].name;
  el("partPanel").style.display="none";
  el("rmMsg").textContent=nm+" — sprzedać czy odłożyć do magazynu?";
  el("rmChoice").style.display="block";
}
function closeRmChoice(){ el("rmChoice").style.display="none"; rmNode=null; }
function removeGear(n){ askRemove(n); }           // kompatybilność wstecz
function finalizeRemove(n,mode){
  if (!n||!n.ref) return;
  snapshot();
  if (n.role==="mach"){
    const t=n.mt,i=S.machines.indexOf(n.ref);
    if (i<0) return;
    S.machines.splice(i,1);
    S.belts=S.belts.filter(b=>b.a!==n.id&&b.b!==n.id);
    if (mode==="sell"){
      const ref=MACHINES[t].cost*Math.pow(MACHINES[t].growth,machCount(t))*.5;
      S.gold+=ref;
      syncNodes(true); sfx.sell(); refreshDrawer();
      toast("Sprzedano "+MACHINES[t].label+" · +"+fmt(ref)+" zł");
    } else {
      S.machStore=S.machStore||{}; S.machStore[t]=(S.machStore[t]||0)+1;
      syncNodes(true); sfx.remove(); refreshDrawer();
      toast(MACHINES[t].label+" odłożona do magazynu");
    }
    return;
  }
  const k=n.kind;
  const i=S.gears.indexOf(n.ref);
  if (i>=0) S.gears.splice(i,1);
  S.belts=S.belts.filter(b=>b.a!==n.id&&b.b!==n.id);
  if (mode==="sell"){
    const ref=KINDS[k].cost*Math.pow(1.17,Math.max(0,S.owned[k]-1))*.5*(KINDS[k].grp===1?FX.pcost:1);
    S.owned[k]=Math.max(0,S.owned[k]-1);
    S.gold+=ref;
    syncNodes(true); sfx.sell(); refreshDrawer();
    toast("Sprzedano "+KINDS[k].name+" · +"+fmt(ref)+" zł");
  } else {
    syncNodes(true); sfx.remove(); refreshDrawer();
    toast(KINDS[k].name+" odłożona do magazynu");
  }
}
function buyUp(i){
  const u=UPGRADES[i];
  if (u.max&&S.ulvl[i]>=u.max) return;
  const c=upCost(i);
  if (S.gold<c) return say("Za mało złota");
  S.gold-=c; S.ulvl[i]++; if (i===2) dirty=true;
  sfx.buy(); refreshDrawer();
}
function buyMachine(t){
  snapshot();
  const fromStore=S.machStore&&S.machStore[t]>0;
  const c=fromStore?0:machCost(t);
  if (!fromStore&&S.gold<c) return say("Za mało złota");
  const peg=findFreeSpot(KINDS[MACHINES[t].kind].pitch,true);
  if (!peg) return say("Brak miejsca na powierzchni");
  const nm={id:S.nextId++,t,x:peg.x,y:peg.y};
  if (fromStore) S.machStore[t]--; else S.gold-=c;
  S.machines.push(nm);
  syncNodes(true);
  const nn=byId.get(nm.id); if (nn) nn.hl=1;
  shake=.8; confetti(); sfx.board();
  toast(fromStore?(MACHINES[t].short+" "+MACHINES[t].label+" wyjęta z magazynu")
                 :(MACHINES[t].short+" "+MACHINES[t].label+" postawiona na powierzchni"));
  refreshDrawer();
}

const prestigeGain=()=>S.earnedRun<PRESTIGE_REQ?0:Math.floor(10*Math.sqrt(S.earnedRun/PRESTIGE_REQ));
function doPrestige(){
  const g=prestigeGain(); if (g<=0) return;
  trackRepeat("prestige",{rdzenie:g});
  const keep={shards:S.shards+g,best:Math.max(S.best,S.earnedRun),perk:S.perk,muted:S.muted,
              msn:S.msn,res:S.res,rp:S.rp,engine:S.engine};
  S=freshState(); Object.assign(S,keep);
  scanned.clear(); invalidateOffers(); startRun();
  shake=1.5; confetti(); sfx.prestige();
  toast("⬢ Wymiana wału · +"+g+" rdzeni"); renderPanels();
}

let beltMode=false,beltFirst=null,pipeMode=false,shaftMode=false,chainMode=false;
function startBelt(){
  const c=beltCost();
  if (S.gold<c) return say("Pasek kosztuje "+fmt(c)+" zł");
  pipeMode=false; beltMode=true; beltFirst=null; syncTools();
  say("Wybierz pierwszą zębatkę");
}
function cancelBelt(){ beltMode=false; shaftMode=false; chainMode=false; beltFirst=null; syncTools(); }
function startChain(){
  const c=chainCost();
  if (S.gold<c) return say("Łańcuch kosztuje "+fmt(c)+" zł");
  pipeMode=false; beltMode=true; chainMode=true; shaftMode=false; beltFirst=null; syncTools();
  say("Łańcuch: wybierz pierwsze koło (2x lub większe)");
}
function startShaft(){
  const c=shaftCost();
  if (S.gold<c) return say("Wał kosztuje "+fmt(c)+" zł");
  pipeMode=false; beltMode=true; shaftMode=true; beltFirst=null; syncTools();
  say("Wał: wybierz pierwszą zębatkę");
}
function tryBelt(n){
  if (!beltFirst){ beltFirst=n; say("Teraz drugą zębatkę"); sfx.place(); return; }
  if (n===beltFirst){ cancelBelt(); return; }
  if (chainMode){
    const dd=Math.hypot(n.x-beltFirst.x,n.y-beltFirst.y);
    if (pitchOf(n)<1||pitchOf(beltFirst)<1){ cancelBelt(); return say("Łańcuch wymaga kół 2x lub większych"); }
    if (dd<CHAIN.minD){ cancelBelt(); return say("Za blisko na łańcuch"); }
    if (dd>CHAIN.maxD){ cancelBelt(); return say("Za daleko na łańcuch"); }
    if (S.chains.some(b=>(b.a===n.id&&b.b===beltFirst.id)||(b.b===n.id&&b.a===beltFirst.id))){
      cancelBelt(); return say("Łańcuch już istnieje"); }
    const cc=chainCost();
    if (S.gold<cc){ cancelBelt(); return say("Za mało złota"); }
    S.gold-=cc; S.chainsBought++;
    S.chains.push({a:beltFirst.id,b:n.id});
    cancelBelt(); dirty=true; sfx.board(); toast("Łańcuch założony");
    return;
  }
  if (shaftMode){
    const dd=Math.hypot(n.x-beltFirst.x,n.y-beltFirst.y);
    if (dd<SHAFT.minD){ cancelBelt(); return say("Za blisko na wał"); }
    if (dd>SHAFT.maxD){ cancelBelt(); return say("Za daleko na wał"); }
    if (S.shafts.some(b=>(b.a===n.id&&b.b===beltFirst.id)||(b.b===n.id&&b.a===beltFirst.id))){
      cancelBelt(); return say("Wał już istnieje"); }
    const cc=shaftCost();
    if (S.gold<cc){ cancelBelt(); return say("Za mało złota"); }
    S.gold-=cc; S.shaftsBought++;
    S.shafts.push({a:beltFirst.id,b:n.id});
    cancelBelt(); dirty=true; sfx.board(); toast("Wał zamontowany");
    return;
  }
  const d=Math.hypot(n.x-beltFirst.x,n.y-beltFirst.y);
  if (d<BELT.minD){ cancelBelt(); return say("Za blisko"); }
  if (d>BELT.maxD){ cancelBelt(); return say("Za daleko"); }
  if (S.belts.some(b=>(b.a===n.id&&b.b===beltFirst.id)||(b.b===n.id&&b.a===beltFirst.id))){
    cancelBelt(); return say("Pasek już istnieje"); }
  const c=beltCost();
  if (S.gold<c){ cancelBelt(); return say("Za mało złota"); }
  S.gold-=c; S.beltsBought++;
  S.belts.push({a:beltFirst.id,b:n.id});
  cancelBelt(); dirty=true; sfx.board(); toast("Pasek założony");
}
function chainNear(x,y){
  for (let i=S.chains.length-1;i>=0;i--){
    const a=byId.get(S.chains[i].a),b=byId.get(S.chains[i].b);
    if (!a||!b) continue;
    const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1;
    let t=((x-a.x)*dx+(y-a.y)*dy)/L2; t=Math.max(0,Math.min(1,t));
    if (Math.hypot(x-(a.x+dx*t),y-(a.y+dy*t))<.3) return i;
  }
  return -1;
}
function shaftNear(x,y){
  for (let i=S.shafts.length-1;i>=0;i--){
    const a=byId.get(S.shafts[i].a),b=byId.get(S.shafts[i].b);
    if (!a||!b) continue;
    const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1;
    let t=((x-a.x)*dx+(y-a.y)*dy)/L2; t=Math.max(0,Math.min(1,t));
    if (Math.hypot(x-(a.x+dx*t),y-(a.y+dy*t))<.3) return i;
  }
  return -1;
}
function beltNear(x,y){
  for (let i=S.belts.length-1;i>=0;i--){
    const a=byId.get(S.belts[i].a),b=byId.get(S.belts[i].b);
    if (!a||!b) continue;
    const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy;
    if (L2<1e-6) continue;
    let t=((x-a.x)*dx+(y-a.y)*dy)/L2; t=Math.max(0,Math.min(1,t));
    if (Math.hypot(x-(a.x+dx*t),y-(a.y+dy*t))<.28) return i;
  }
  return -1;
}

const sfx=(()=>{
  let ac=null,master=null,noiseBuf=null;
  // warstwy silnika: dudnienie wału + pisk zazębienia + szum metalu
  let rumOsc,rumFil,rumGain, meshOsc,meshFil,meshGain, nSrc,nFil,nGain;

  function makeNoise(){
    const len=Math.floor(ac.sampleRate*2);
    const b=ac.createBuffer(1,len,ac.sampleRate);
    const d=b.getChannelData(0);
    let last=0;
    for (let i=0;i<len;i++){                    // szum brązowy = cieplejszy, mniej syczy
      const w=Math.random()*2-1;
      last=(last+.02*w)/1.02; d[i]=last*3.2;
    }
    return b;
  }

  function init(){
    if (ac) return;
    const AC=window.AudioContext||window.webkitAudioContext; if (!AC) return;
    try{
      ac=new AC();
      master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination);
      noiseBuf=makeNoise();

      rumOsc=ac.createOscillator(); rumOsc.type="sawtooth"; rumOsc.frequency.value=30;
      rumFil=ac.createBiquadFilter(); rumFil.type="lowpass"; rumFil.frequency.value=260; rumFil.Q.value=6;
      rumGain=ac.createGain(); rumGain.gain.value=0;
      rumOsc.connect(rumFil); rumFil.connect(rumGain); rumGain.connect(master); rumOsc.start();

      meshOsc=ac.createOscillator(); meshOsc.type="square"; meshOsc.frequency.value=120;
      meshFil=ac.createBiquadFilter(); meshFil.type="bandpass"; meshFil.frequency.value=900; meshFil.Q.value=3.5;
      meshGain=ac.createGain(); meshGain.gain.value=0;
      meshOsc.connect(meshFil); meshFil.connect(meshGain); meshGain.connect(master); meshOsc.start();

      nSrc=ac.createBufferSource(); nSrc.buffer=noiseBuf; nSrc.loop=true;
      nFil=ac.createBiquadFilter(); nFil.type="bandpass"; nFil.frequency.value=1200; nFil.Q.value=1.1;
      nGain=ac.createGain(); nGain.gain.value=0;
      nSrc.connect(nFil); nFil.connect(nGain); nGain.connect(master); nSrc.start();
    }catch(e){ ac=null; }
  }

  /* metaliczne stuknięcie zęba: krótki impuls szumu + dzwoniący ton */
  function clank(freq,dur,vol,bright){
    if (!ac||S.muted) return;
    const t=ac.currentTime;
    const n=ac.createBufferSource(); n.buffer=noiseBuf;
    n.playbackRate.value=.8+Math.random()*.5;
    const f=ac.createBiquadFilter(); f.type="bandpass";
    f.frequency.value=(bright||1800)*(.9+Math.random()*.2); f.Q.value=2.2;
    const g=ac.createGain(); g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(f); f.connect(g); g.connect(master);
    n.start(t); n.stop(t+dur+.02);

    const o=ac.createOscillator(); o.type="triangle"; o.frequency.setValueAtTime(freq,t);
    o.frequency.exponentialRampToValueAtTime(freq*.55,t+dur*.9);
    const og=ac.createGain(); og.gain.setValueAtTime(vol*.7,t);
    og.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(og); og.connect(master); o.start(t); o.stop(t+dur+.02);
  }

  function tone(f,dur,type,vol,slide){
    if (!ac||S.muted) return;
    const t=ac.currentTime;
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||"triangle"; o.frequency.value=f;
    if (slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(vol||.06,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.02);
  }

  return{
    unlock(){ init(); if (ac&&ac.state==="suspended") ac.resume(); },
    // stuknięcie w korbę = zapadka wału, wyżej przy większym rozpędzie
    tap(b,c){ clank(240+Math.min(b,12)*26+c*10,.075,.16,1500+Math.min(b,12)*70); },
    crit(){ clank(520,.16,.26,3200); setTimeout(()=>clank(340,.2,.18,2200),60); },
    place(){ clank(300,.11,.2,2400); try{ navigator.vibrate&&navigator.vibrate(12); }catch(e){} },                 // zazębienie
    remove(){ clank(150,.13,.16,900); try{ navigator.vibrate&&navigator.vibrate([8,30,8]); }catch(e){} },                // rozłączenie
    buy(){ clank(420,.07,.14,2600); setTimeout(()=>clank(560,.07,.12,3000),60); },
    sell(){ [440,660,880].forEach((f,i)=>setTimeout(()=>clank(f,.1,.15,2600+i*500),i*70)); },
    board(){ try{ navigator.vibrate&&navigator.vibrate(28); }catch(e){} clank(180,.22,.24,1200); setTimeout(()=>clank(260,.2,.2,1800),110); },
    prestige(){ [200,300,400,600].forEach((f,i)=>setTimeout(()=>clank(f,.24,.2,1400+i*400),i*110)); },
    jam(){                                              // zgrzyt: szum + szybkie drgania
      if (!ac||S.muted) return;
      const t=ac.currentTime;
      const n=ac.createBufferSource(); n.buffer=noiseBuf; n.playbackRate.value=.5;
      const f=ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value=700; f.Q.value=6;
      const g=ac.createGain(); g.gain.setValueAtTime(.001,t);
      g.gain.linearRampToValueAtTime(.22,t+.03);
      g.gain.exponentialRampToValueAtTime(.0001,t+.5);
      const lfo=ac.createOscillator(); lfo.type="square"; lfo.frequency.value=26;
      const lg=ac.createGain(); lg.gain.value=500;
      lfo.connect(lg); lg.connect(f.frequency); lfo.start(t); lfo.stop(t+.55);
      n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t+.55);
    },
    coin(){ clank(900,.05,.07,4000); },
    ping(){ tone(1500,.1,"sine",.06,850); },

    /* ciągły dźwięk maszyny — wprost z obrotów i liczby zazębień */
    update(rpm,on){
      if (!ac||!rumGain) return;
      const t=ac.currentTime, k=.12;
      if (!on||S.muted){
        rumGain.gain.setTargetAtTime(0,t,k);
        meshGain.gain.setTargetAtTime(0,t,k);
        nGain.gain.setTargetAtTime(0,t,k);
        return;
      }
      const r=Math.min(rpm,8000);
      const rev=r/60;                                   // obroty na sekundę
      const teeth=12+contacts.length*2;                 // gęstsza maszyna = gęstszy pisk
      const load=Math.min(1,(machineLoad()-1)/2);

      rumOsc.frequency.setTargetAtTime(Math.max(18,rev*2.2),t,k);
      rumFil.frequency.setTargetAtTime(140+rev*6,t,k);
      rumGain.gain.setTargetAtTime(Math.min(.09,.012+rev*.0016),t,k);

      meshOsc.frequency.setTargetAtTime(Math.min(4200,Math.max(40,rev*teeth)),t,k);
      meshFil.frequency.setTargetAtTime(Math.min(6000,600+rev*22),t,k);
      meshGain.gain.setTargetAtTime(Math.min(.035,.004+rev*.0007),t,k);

      nFil.frequency.setTargetAtTime(Math.min(5000,700+rev*16),t,k);
      nGain.gain.setTargetAtTime(Math.min(.05,.006+rev*.0009+load*.02),t,k);
    }
  };
})();

function fmt(v){
  if (!isFinite(v)) return "0";
  if (v<1000) return v<10?v.toFixed(1):Math.floor(v).toString();
  const s=["","K","M","B","T","aa","ab","ac"];
  let t=0; while (v>=1000&&t<s.length-1){ v/=1000; t++; }
  return (v<10?v.toFixed(2):v.toFixed(1))+s[t];
}

const cv=document.getElementById("cv"),ctx=cv.getContext("2d",{alpha:false});
let W=0,H=0,scale=1,camX=0,camY=0,fitScale=1,DPR=1;
const gearPaths=new Map();

function pathFor(kind){
  let p=gearPaths.get(kind);
  if (p) return p;
  const t=KINDS[kind].teeth, st=t*9;
  p=new Path2D();
  for (let i=0;i<=st;i++){
    const a=i/st*Math.PI*2, r=Math.cos(a*t)>0?1:.86;
    const x=Math.cos(a)*r,y=Math.sin(a)*r;
    i?p.lineTo(x,y):p.moveTo(x,y);
  }
  p.closePath();
  gearPaths.set(kind,p);
  return p;
}

function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=r.width; H=r.height;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  sizeCharts();
  computeFit(); fitCamera();
}
addEventListener("resize",resize);

let wideView=false;
function viewBox(){
  let a=G.minX,b=G.maxX,c=G.minY,d=Math.max(G.maxY,G.crankY+2.2);
  if (wideView)
    for (const o of offers()){
      a=Math.min(a,secX0(o.cx)); b=Math.max(b,secX0(o.cx)+SW);
      c=Math.min(c,secY0(o.cy)-SH); d=Math.max(d,secY0(o.cy));
    }
  const m=wideView?1.2:(W<520?.05:.15);
  return {a:a-m,b:b+m,c:c-m,d:d+m};
}
function computeFit(){
  if (!W||!H) return;
  const v=viewBox();
  fitScale=Math.min(W/Math.max(v.b-v.a,6),H/Math.max(v.d-v.c,6));
}
let tScale=0,tCamX=0,tCamY=0,camAnim=0;
function fitCamera(anim){
  computeFit(); const v=viewBox();
  tScale=fitScale; tCamX=(v.a+v.b)/2; tCamY=(v.c+v.d)/2;
  if (anim){ camAnim=1; }
  else { scale=tScale; camX=tCamX; camY=tCamY; camAnim=0; }
}
function stepCam(dt){
  if (camAnim<=0) return;
  const k=1-Math.exp(-9*dt);
  scale+=(tScale-scale)*k; camX+=(tCamX-camX)*k; camY+=(tCamY-camY)*k;
  if (Math.abs(tScale-scale)<.05&&Math.abs(tCamX-camX)<.02&&Math.abs(tCamY-camY)<.02){
    scale=tScale; camX=tCamX; camY=tCamY; camAnim=0;
  }
}
function clampCam(){
  scale=Math.max(fitScale*.4,Math.min(fitScale*5,scale));
  const lx=Math.max(Math.abs(G.minX),Math.abs(G.maxX))+SW*1.5;
  camX=Math.max(-lx,Math.min(lx,camX));
  camY=Math.max(G.minY-SH,Math.min(G.crankY+4,camY));
}
const sx=x=>W/2+(x-camX)*scale, sy=y=>H/2-(y-camY)*scale;
const wx=p=>(p-W/2)/scale+camX, wy=p=>camY-(p-H/2)/scale;

function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  return `rgb(${Math.min(255,Math.round(((n>>16)&255)*f))},${Math.min(255,Math.round(((n>>8)&255)*f))},${Math.min(255,Math.round((n&255)*f))})`;
}

function drawNode(n,dragging){
  const d=KINDS[n.kind],s=n.spawn;
  const ease=s>=1?1:(1+2.2*Math.pow(s-1,3)+1.2*Math.pow(s-1,2));
  const tip=d.pitch*1.075*scale*ease;
  if (tip<1.2) return;
  const isM=n.role==="mach";
  const isE=n.role==="crank";
  const mc=isM?MACHINES[n.mt].col:isE?ENG().col:d.col;
  let base=mc;
  if (jammed&&n.powered) base="#e05a4f";
  else if (!n.powered) base=shade(mc,.36);
  const px=sx(n.x),py=sy(n.y);

  if (isM){
    ctx.save(); ctx.translate(px,py);
    ctx.beginPath(); ctx.arc(0,0,tip*1.8,0,Math.PI*2);
    ctx.strokeStyle=n.powered?shade(mc,1.05):"rgba(255,255,255,.08)";
    ctx.globalAlpha=n.powered?.45:1; ctx.lineWidth=Math.max(1.5,tip*.15); ctx.stroke();
    ctx.globalAlpha=1;
    ctx.restore();
  }

  ctx.save(); ctx.translate(px,py); ctx.rotate(-n.angle);
  if (n.role==="crank"){ const p=1+punch*.07; ctx.scale(p,p); }
  const spr=sprReady?tinted(gearSprite(n.kind),base):null;
  if (spr) ctx.drawImage(spr,-tip,-tip,tip*2,tip*2);
  else {
    ctx.scale(tip,tip);
    const P=pathFor(n.kind);
    ctx.fillStyle=base; ctx.fill(P);
    ctx.lineWidth=.05; ctx.strokeStyle=shade(mc,.45); ctx.stroke(P);
  }
  ctx.restore();

  ctx.save(); ctx.translate(px,py); ctx.rotate(-n.angle);
  if (!isM&&d.drive<d.pitch){
    const it=tip*(d.drive/d.pitch), ic=shade(d.col,n.powered?.8:.3);
    const s2=sprReady?tinted("gear_08",ic):null;
    if (s2) ctx.drawImage(s2,-it,-it,it*2,it*2);
    else { ctx.save(); ctx.scale(it,it); ctx.fillStyle=ic; ctx.fill(pathFor(0)); ctx.restore(); }
  }
  if (!isM&&d.drive>d.pitch){
    const ot=tip*(d.drive/d.pitch);
    ctx.beginPath(); ctx.arc(0,0,ot,0,Math.PI*2);
    ctx.strokeStyle=shade(d.col,n.powered?1.05:.4);
    ctx.globalAlpha=.5; ctx.lineWidth=Math.max(1.5,tip*.2); ctx.stroke(); ctx.globalAlpha=1;
  }
  if (d.clutch&&n.ref&&n.ref.off){
    ctx.strokeStyle="#ff7a8a"; ctx.lineWidth=Math.max(2,tip*.16); ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(-tip*.5,-tip*.5); ctx.lineTo(tip*.5,tip*.5);
    ctx.moveTo(tip*.5,-tip*.5); ctx.lineTo(-tip*.5,tip*.5); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0,0,tip*.15,0,Math.PI*2); ctx.fillStyle="#0b0e13"; ctx.fill();
  ctx.beginPath(); ctx.moveTo(tip*.22,0); ctx.lineTo(tip*.78,0);
  ctx.lineWidth=Math.max(1.5,tip*.11); ctx.lineCap="round";
  ctx.strokeStyle=n.powered?"rgba(255,255,255,.85)":"rgba(255,255,255,.2)";
  ctx.stroke(); ctx.restore();

  if (isM){                       // godło maszyny w środku koła, nie obraca się
    const r=tip*.74, bob=Math.sin(bgT*14+n.x)*Math.min(1,Math.abs(n.rpm)/1500)*tip*.08;
    const nm=n.mt===M_DRILL?"m_drill":n.mt===M_GEN?"m_gen":n.mt===M_CRUSH?"m_crush"
            :n.mt===M_PUMP?"i_clutch":"i_gov";
    const s3=sprReady?tinted(nm,n.powered?shade(mc,1.3):"#6b7484"):null;
    ctx.save(); ctx.translate(px,py+bob);
    ctx.fillStyle="rgba(9,13,19,.78)";
    ctx.beginPath(); ctx.arc(0,0,r*.8,0,Math.PI*2); ctx.fill();
    if (s3) ctx.drawImage(s3,-r*.7,-r*.7,r*1.4,r*1.4);
    else { ctx.fillStyle=n.powered?shade(mc,1.2):"#6b7484";
      ctx.beginPath(); ctx.arc(0,0,r*.42,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
  if (!isM&&(d.vari||d.centri||d.hoist)){
    const r=tip*.62;
    ctx.save(); ctx.translate(px,py);
    ctx.fillStyle="rgba(9,13,19,.72)";
    ctx.beginPath(); ctx.arc(0,0,r*.95,0,Math.PI*2); ctx.fill();
    const c=n.powered?shade(d.col,1.35):"#6b7484";
    ctx.strokeStyle=c; ctx.fillStyle=c;
    ctx.lineWidth=Math.max(1.5,r*.16); ctx.lineCap="round";
    if (d.vari){                              // stożki wariatora
      const k=n.ref&&n.ref.k!==undefined?n.ref.k:1;
      const f=Math.min(1,k/3);
      ctx.beginPath(); ctx.moveTo(-r*.7,-r*.5); ctx.lineTo(-r*.7,r*.5);
      ctx.lineTo(r*.7,r*.5*(1-f)); ctx.lineTo(r*.7,-r*.5*(1-f)); ctx.closePath(); ctx.fill();
      ctx.font="800 "+Math.max(8,r*.5)+"px sans-serif"; ctx.textAlign="center";
      ctx.fillStyle="#0b0e13"; ctx.fillText("×"+k,0,r*.18);
    } else if (d.centri){                     // ciężarki odśrodkowe
      const open=n.cut?r*.62:r*.3;
      for (let i=0;i<2;i++){
        const a=i?Math.PI:0;
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(a)*open,Math.sin(a)*open-r*.2); ctx.stroke();
        ctx.beginPath(); ctx.arc(Math.cos(a)*open,Math.sin(a)*open-r*.2,r*.2,0,Math.PI*2); ctx.fill();
      }
      if (n.cut){ ctx.strokeStyle="#ff8a7a"; ctx.lineWidth=Math.max(2,r*.18);
        ctx.beginPath(); ctx.moveTo(-r*.5,r*.5); ctx.lineTo(r*.5,-r*.5); ctx.stroke(); }
    } else {                                  // wyciąg: klatka na linie
      ctx.beginPath(); ctx.moveTo(0,-r*.8); ctx.lineTo(0,-r*.15); ctx.stroke();
      ctx.strokeRect(-r*.42,-r*.15,r*.84,r*.75);
      ctx.beginPath(); ctx.moveTo(-r*.42,r*.25); ctx.lineTo(r*.42,r*.25); ctx.stroke();
    }
    ctx.restore();
  }
  if (!isM&&(d.accu||d.damp)){
    const r=tip*.62;
    ctx.save(); ctx.translate(px,py);
    ctx.fillStyle="rgba(9,13,19,.72)";
    ctx.beginPath(); ctx.arc(0,0,r*.95,0,Math.PI*2); ctx.fill();
    const c=n.powered?shade(d.col,1.35):"#6b7484";
    ctx.strokeStyle=c; ctx.fillStyle=c;
    ctx.lineWidth=Math.max(1.5,r*.16); ctx.lineCap="round";

    if (d.accu){                  // ogniwo
      ctx.fillRect(-r*.45,-r*.6,r*.9,r*1.2);
      ctx.fillStyle="#0b0e13";
      ctx.fillRect(-r*.28,-r*.42,r*.56,r*.24);
      ctx.fillRect(-r*.28,-r*.06,r*.56,r*.24);
      ctx.fillStyle=c; ctx.fillRect(-r*.18,-r*.82,r*.36,r*.2);
    } else {                             // tłumik: koncentryczne fale
      for (let i=1;i<=3;i++){
        ctx.globalAlpha=1-i*.22;
        ctx.beginPath(); ctx.arc(0,0,r*.24*i,-Math.PI*.75,Math.PI*.25); ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    ctx.restore();
  }
  if (!isM&&(d.gov||d.clutch)){
    const r=tip*.62;
    const s4=sprReady?tinted(d.gov?"i_gov":"i_clutch",n.powered?"#dbe4f0":"#6b7484"):null;
    if (s4){
      ctx.save(); ctx.translate(px,py);
      ctx.fillStyle="rgba(9,13,19,.7)";
      ctx.beginPath(); ctx.arc(0,0,r*.8,0,Math.PI*2); ctx.fill();
      ctx.drawImage(s4,-r*.72,-r*.72,r*1.44,r*1.44);
      ctx.restore();
    }
  }
  if (isE){                       // godło silnika: każdy typ wygląda inaczej
    const r=tip*.5, e=S.engine||0;
    ctx.save(); ctx.translate(px,py);
    ctx.fillStyle="rgba(9,13,19,.8)";
    ctx.beginPath(); ctx.arc(0,0,r*1.15,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=shade(ENG().col,1.2); ctx.lineWidth=Math.max(2,r*.2); ctx.lineCap="round";
    if (e===0){                                   // korba: rączka
      ctx.beginPath(); ctx.moveTo(-r*.5,r*.4); ctx.lineTo(0,-r*.5); ctx.lineTo(r*.55,-r*.1);
      ctx.stroke();
    } else if (e===1){                            // parowy: komin z dymem
      ctx.fillStyle=shade(ENG().col,1.2);
      ctx.fillRect(-r*.28,-r*.75,r*.56,r*1.1);
      ctx.beginPath(); ctx.arc(0,-r*.95,r*.3,0,Math.PI*2); ctx.fill();
    } else if (e===2){                            // turbina: łopatki
      for (let i=0;i<5;i++){
        ctx.save(); ctx.rotate(i/5*Math.PI*2);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(r*.5,-r*.25,r*.85,r*.1);
        ctx.stroke(); ctx.restore();
      }
    } else {                                      // spalinowy: tłok
      ctx.beginPath(); ctx.moveTo(0,r*.75); ctx.lineTo(0,-r*.2); ctx.stroke();
      ctx.fillStyle=shade(ENG().col,1.2);
      ctx.fillRect(-r*.6,-r*.8,r*1.2,r*.55);
    }
    ctx.restore();
  }
  const mk=mkOf(n);
  if (mk>0){
    ctx.beginPath(); ctx.arc(px,py,tip*1.2,0,Math.PI*2);
    ctx.strokeStyle=MK[mk].col; ctx.lineWidth=Math.max(1.5,tip*.09); ctx.stroke();
    for (let i=0;i<mk;i++){
      ctx.beginPath();
      ctx.arc(px+Math.cos(-Math.PI/2+i*.5)*tip*1.2,py+Math.sin(-Math.PI/2+i*.5)*tip*1.2,
              Math.max(1.5,tip*.11),0,Math.PI*2);
      ctx.fillStyle=MK[mk].col; ctx.fill();
    }
  }
  if (n.hl>0){
    ctx.beginPath(); ctx.arc(px,py,tip*(1.5+n.hl*.9),0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,220,120,${n.hl*.9})`; ctx.lineWidth=3; ctx.stroke();
  }
  if (beltMode&&n===beltFirst){
    ctx.beginPath(); ctx.arc(px,py,tip*1.5,0,Math.PI*2);
    ctx.strokeStyle="#6ecf9a"; ctx.lineWidth=2; ctx.stroke();
  }
}

function drawPipes(){
  const r=PIPE.step*scale*.34;
  for (const p of S.pipes){
    const x=sx(p.x),y=sy(p.y);
    ctx.fillStyle="#3b4657";
    ctx.fillRect(x-r,y-r,r*2,r*2);
    ctx.fillStyle="#586679";
    ctx.fillRect(x-r*.55,y-r,r*1.1,r*2);
  }
  // połączenia
  ctx.strokeStyle="#4a586b"; ctx.lineWidth=Math.max(2,r*.7);
  for (let i=0;i<S.pipes.length;i++)
    for (let j=i+1;j<S.pipes.length;j++){
      const a=S.pipes[i],b=S.pipes[j];
      if (Math.hypot(a.x-b.x,a.y-b.y)>PIPE.step+.06) continue;
      ctx.beginPath(); ctx.moveTo(sx(a.x),sy(a.y)); ctx.lineTo(sx(b.x),sy(b.y)); ctx.stroke();
    }
}

function drawSectors(){
  const surfY=sy(SY0);
  for (const t of S.sectors){
    const bx=sx(secX0(t.cx)),by=sy(secY0(t.cy)),w=SW*scale,h=SH*scale;
    ctx.fillStyle=`rgb(${Math.max(9,22-t.cy*3)},${Math.max(12,28-t.cy*4)},${Math.max(16,38-t.cy*5)})`;
    ctx.fillRect(bx,by,w,h);
    if (t.rev&&scale>26){
      ctx.save(); ctx.beginPath(); ctx.rect(bx,by,w,h); ctx.clip();
      const st=.5*scale; ctx.lineWidth=1;
      for (let k=1;k*st<w;k++){
        const X=bx+k*st;
        ctx.strokeStyle=(k%4===0)?"rgba(150,190,240,.10)":"rgba(150,190,240,.04)";
        ctx.beginPath(); ctx.moveTo(X,by); ctx.lineTo(X,by+h); ctx.stroke();
      }
      for (let k=1;k*st<h;k++){
        const Y=by+k*st;
        ctx.strokeStyle=(k%4===0)?"rgba(150,190,240,.10)":"rgba(150,190,240,.04)";
        ctx.beginPath(); ctx.moveTo(bx,Y); ctx.lineTo(bx+w,Y); ctx.stroke();
      }
      if (scale>44){
        ctx.strokeStyle="rgba(160,200,250,.16)"; ctx.lineWidth=1;
        const c=st*4;
        for (let X=bx+c;X<bx+w-1;X+=c) for (let Y=by+c;Y<by+h-1;Y+=c){
          ctx.beginPath(); ctx.moveTo(X-3,Y); ctx.lineTo(X+3,Y);
          ctx.moveTo(X,Y-3); ctx.lineTo(X,Y+3); ctx.stroke();
        }
      }
      ctx.restore();
    }
    ctx.strokeStyle=drag.n?"rgba(120,235,175,.55)":"rgba(130,175,235,.32)";
    ctx.lineWidth=drag.n?2.5:1.4;
    ctx.strokeRect(bx,by,w,h);
  }
  // linia powierzchni
  ctx.strokeStyle="rgba(200,180,120,.35)"; ctx.lineWidth=2;
  ctx.lineWidth=3; ctx.strokeStyle="rgba(224,198,132,.6)";
  ctx.beginPath(); ctx.moveTo(0,surfY); ctx.lineTo(W,surfY); ctx.stroke();
  ctx.fillStyle="rgba(224,198,132,.14)"; ctx.fillRect(0,surfY-5,W,5);
  ctx.fillStyle="rgba(200,180,120,.5)"; ctx.textAlign="left";
  ctx.font="700 10px sans-serif";
  ctx.fillText("POWIERZCHNIA",6,surfY-5);

  saleRects.length=0;
  const mapView=wideView;
  for (const o of offers()){
    const bx=sx(secX0(o.cx)),by=sy(secY0(o.cy)),w=SW*scale,h=SH*scale;
    const can=S.gold>=o.cost;
    if (mapView) saleRects.push({x:bx,y:by,w,h,o});
    ctx.setLineDash(mapView?[8,7]:[5,9]);
    ctx.strokeStyle=can?(mapView?"rgba(120,235,175,.7)":"rgba(120,235,175,.2)")
                       :"rgba(140,160,190,.14)";
    ctx.lineWidth=mapView?2:1.5; ctx.strokeRect(bx,by,w,h); ctx.setLineDash([]);
    if (mapView&&w>58){
      ctx.textAlign="center";
      if (o.scanned){                       // radar już to sprawdził — pokaż próbkę rudy
        let hh=((o.cx*73856093)^(o.cy*19349663)^0x5f356495)>>>0;
        const rnd=()=>{ hh=(hh*1664525+1013904223)>>>0; return hh/4294967296; };
        ctx.globalAlpha=.35;
        for (let i=0;i<5+o.q*2;i++){
          ctx.fillStyle=QUAL[o.q].c;
          ctx.beginPath();
          ctx.arc(bx+w*(.2+rnd()*.6),by+h*(.55+rnd()*.3),Math.max(1.5,w*.014),0,Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha=1;
      }
      ctx.font=`800 ${Math.max(10,w*.1)}px sans-serif`;
      ctx.fillStyle=o.scanned?QUAL[o.q].c:"#6b7686";
      ctx.fillText(o.scanned?QUAL[o.q].n:"? nieznana ruda",bx+w/2,by+h/2);
      ctx.font=`700 ${Math.max(9,w*.085)}px sans-serif`;
      ctx.fillStyle=can?"#bfeed3":"#8b96a8";
      ctx.fillText(fmt(o.cost),bx+w/2,by+h/2+w*.12);
    }
  }
}

function layerLabel(t,bx,by,w){
  if (w<130) return;
  const frac=t.resMax?Math.max(0,t.res/t.resMax):0;
  const txt=t.cy===0 ? "POWIERZCHNIA · skała płonna"
        : ("GŁĘBIA "+t.cy+" · "+QUAL[t.q].n+" · twardość "+hardness(t.cy).toFixed(1)+
           " · "+Math.round(frac*100)+"%");
  ctx.font="700 11px sans-serif"; ctx.textAlign="left";
  const pw=ctx.measureText(txt).width+16;
  ctx.fillStyle="rgba(8,11,16,.8)";
  if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(bx+8,by+7,pw,21,10); ctx.fill(); }
  else ctx.fillRect(bx+8,by+7,pw,21);
  ctx.fillStyle=t.cy===0?"rgba(228,203,142,.92)":QUAL[t.q].c;
  ctx.fillText(txt,bx+16,by+22);
}

function drawStrata(){
  for (const t of S.sectors){
    const bx=sx(secX0(t.cx)),by=sy(secY0(t.cy)),w=SW*scale,h=SH*scale;
    layerLabel(t,bx,by,w);
    if (t.cy===0) continue;                      // powierzchnia nie ma rudy
    const frac=t.resMax?Math.max(0,t.res/t.resMax):0;
    if (frac<=0||w<20) continue;
    const qc=QUAL[t.q].c;
    const R=parseInt(qc.slice(1,3),16),G2=parseInt(qc.slice(3,5),16),B=parseInt(qc.slice(5,7),16);
    ctx.save(); ctx.beginPath(); ctx.rect(bx,by,w,h); ctx.clip();
    ctx.fillStyle=`rgba(${R},${G2},${B},${.05+.07*frac})`;
    ctx.fillRect(bx,by,w,h);

    let hh=((t.cx*73856093)^(t.cy*19349663)^0x5f356495)>>>0;
    const rnd=()=>{ hh=(hh*1664525+1013904223)>>>0; return hh/4294967296; };
    const cnt=Math.round((14+t.q*8)*Math.max(.25,frac));
    for (let i=0;i<cnt;i++){
      const gx=bx+rnd()*w, gy=by+h*.12+rnd()*h*.8;
      const sz=Math.max(1.6,scale*(.045+rnd()*.055));
      ctx.globalAlpha=.55+.35*frac;
      ctx.fillStyle="rgba(8,12,17,.75)";
      ctx.beginPath(); ctx.arc(gx,gy,sz*1.35,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=qc;
      ctx.beginPath(); ctx.arc(gx,gy,sz,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.4)";
      ctx.beginPath(); ctx.arc(gx-sz*.3,gy-sz*.3,sz*.34,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.restore();
  }
}

function drawShafts2(){
  for (const m of machNodes){
    if ((m.mt!==M_DRILL&&m.mt!==M_CRUSH)||!m.depth) continue;
    const x=sx(m.x),y0=sy(m.y),y1=sy(m.y-m.depth);
    ctx.strokeStyle="rgba(20,26,35,.9)"; ctx.lineWidth=Math.max(3,scale*.22);
    ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke();
    ctx.strokeStyle=m.inRock?"rgba(255,150,90,.75)"
                   :m.tqOk?"rgba(200,215,240,.35)":"rgba(224,140,90,.45)";
    ctx.lineWidth=Math.max(1,scale*.06);
    ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke();
    const bw=Math.max(4,scale*.19);
    ctx.fillStyle=m.tqOk?"#c9d4e6":"#e08c5a";
    ctx.beginPath(); ctx.moveTo(x-bw,y1-bw*.6); ctx.lineTo(x+bw,y1-bw*.6);
    ctx.lineTo(x,y1+bw*1.1); ctx.closePath(); ctx.fill();
  }
}

function drawDeposits(){
  for (const d of S.deposits){
    const t=secRec(d.cx,d.cy);
    if (t&&!t.rev) continue;
    const x=sx(d.x),y=sy(d.y),r=Math.max(8,scale*.44);
    const frac=Math.max(0,d.amt/d.max);
    const busy=S.machines.some(m=>Math.hypot(m.x-d.x,m.y-d.y)<.5)
            || S.pipes.some(q=>Math.hypot(q.x-d.x,q.y-d.y)<.7);

    const gl=ctx.createRadialGradient(x,y,r*.2,x,y,r*2.2);
    const qc=QUAL[d.q].c;
    const qr=parseInt(qc.slice(1,3),16),qg=parseInt(qc.slice(3,5),16),qb=parseInt(qc.slice(5,7),16);
    gl.addColorStop(0,`rgba(${qr},${qg},${qb},${(busy?.13:.22)*(.4+.6*frac)})`);
    gl.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(x,y,r*2.2,0,Math.PI*2); ctx.fill();

    // rozsyp rudy: czytelne oznaczenie, które nie zasłania mechanizmu
    let hh=((d.cx*73856093)^(d.cy*19349663)^0x5f356495)>>>0;
    const rnd=()=>{ hh=(hh*1664525+1013904223)>>>0; return hh/4294967296; };
    const cnt=9+d.q*3;
    for (let i=0;i<cnt;i++){
      const ang=rnd()*Math.PI*2, rad=(.3+rnd()*.7)*r*1.5;
      const sz=Math.max(2,r*(.13+rnd()*.15));
      const near=busy&&rad<r*.8;
      const gx2=x+Math.cos(ang)*rad, gy2=y+Math.sin(ang)*rad;
      ctx.globalAlpha=(near?.25:.85)*(.45+.55*frac);
      ctx.fillStyle="rgba(8,12,17,.8)";
      ctx.beginPath(); ctx.arc(gx2,gy2,sz*1.32,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=QUAL[d.q].c;
      ctx.beginPath(); ctx.arc(gx2,gy2,sz,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.42)";
      ctx.beginPath(); ctx.arc(gx2-sz*.3,gy2-sz*.3,sz*.34,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    const rr=Math.max(11,scale*.95);
    ctx.beginPath(); ctx.arc(x,y,rr,-Math.PI/2,-Math.PI/2+Math.PI*2*frac);
    ctx.strokeStyle=frac>.3?"rgba(110,220,160,.4)":"rgba(224,163,85,.5)";
    ctx.lineWidth=Math.max(1.5,scale*.045); ctx.lineCap="round"; ctx.stroke();
  }
}

function drawChains(){
  for (const ch of S.chains){
    const a=byId.get(ch.a),b=byId.get(ch.b);
    if (!a||!b) continue;
    const on=a.powered||b.powered;
    const ax=sx(a.x),ay=sy(a.y),bx=sx(b.x),by=sy(b.y);
    const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
    const nx=-uy,ny=ux;
    const off=Math.max(3,scale*.16);
    for (const sgn of [1,-1]){
      const x0=ax+nx*off*sgn, y0=ay+ny*off*sgn;
      const seg=Math.max(7,scale*.26), cnt=Math.floor(L/seg);
      ctx.strokeStyle=on?"#7d8a9e":"#333c49";
      ctx.lineWidth=Math.max(2,scale*.07);
      for (let i=0;i<cnt;i++){
        const t0=i*seg, t1=t0+seg*.62;
        ctx.beginPath();
        ctx.moveTo(x0+ux*t0,y0+uy*t0); ctx.lineTo(x0+ux*t1,y0+uy*t1); ctx.stroke();
      }
      if (on){
        ctx.fillStyle="rgba(200,220,250,.5)";
        const ph=(bgT*Math.min(300,Math.abs(a.rpm))*.02)%1;
        for (let i=0;i<cnt;i++){
          const tt=(i+ph)*seg;
          if (tt>L) continue;
          ctx.beginPath();
          ctx.arc(x0+ux*tt,y0+uy*tt,Math.max(1.2,scale*.035),0,Math.PI*2); ctx.fill();
        }
      }
    }
  }
}

function drawShafts(){
  for (const sh of S.shafts){
    const a=byId.get(sh.a),b=byId.get(sh.b);
    if (!a||!b) continue;
    const on=a.powered||b.powered;
    const ax=sx(a.x),ay=sy(a.y),bx=sx(b.x),by=sy(b.y);
    const w=Math.max(3,scale*.19);
    ctx.lineCap="butt";
    ctx.strokeStyle=on?"#5d6a7d":"#2b333f"; ctx.lineWidth=w;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    ctx.strokeStyle=on?"rgba(215,230,250,.5)":"rgba(150,170,200,.18)";
    ctx.lineWidth=Math.max(1,w*.28);
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    // tuleje na końcach
    const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
    ctx.fillStyle=on?"#8a97ab":"#3a4453";
    for (const t of [0.13,0.87]){
      const cx=ax+dx*t, cy=ay+dy*t;
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.atan2(uy,ux));
      ctx.fillRect(-w*.35,-w*.85,w*.7,w*1.7);
      ctx.restore();
    }
  }
}

function drawBelts(){
  for (const bl of S.belts){
    const a=byId.get(bl.a),b=byId.get(bl.b);
    if (!a||!b) continue;
    const on=a.powered||b.powered;
    const ax=sx(a.x),ay=sy(a.y),bx=sx(b.x),by=sy(b.y);
    const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1;
    const nx=-dy/L*pitchOf(a)*scale*.72, ny=dx/L*pitchOf(a)*scale*.72;
    ctx.lineCap="round"; ctx.strokeStyle=on?"#3a4453":"#242b36";
    ctx.lineWidth=Math.max(2,scale*.13);
    ctx.beginPath(); ctx.moveTo(ax+nx,ay+ny); ctx.lineTo(bx+nx,by+ny);
    ctx.moveTo(ax-nx,ay-ny); ctx.lineTo(bx-nx,by-ny); ctx.stroke();
  }
}

/* liczbowy odczyt nad maszynami i regulatorami — koniec zgadywania obrotów */
/* podświetlenie gałęzi wybranej zębatki + obroty na każdym ogniwie */
function drawBranch(){
  if (!selNode||!nodes.includes(selNode)) { selNode=null; return; }
  const chain=[]; let n=selNode;
  while (n){ chain.push(n); n=n.par; }
  const down=[]; const q=[selNode];
  for (let i=0;i<q.length;i++)
    for (const nb of q[i].nb){
      const m2=nb.n||nb;
      if (m2.par===q[i]&&!q.includes(m2)){ q.push(m2); down.push(m2); }
    }
  const all=chain.concat(down);
  ctx.save();
  for (let i=1;i<chain.length;i++){
    ctx.beginPath();
    ctx.moveTo(sx(chain[i-1].x),sy(chain[i-1].y));
    ctx.lineTo(sx(chain[i].x),sy(chain[i].y));
    ctx.strokeStyle="rgba(255,209,102,.55)"; ctx.lineWidth=3; ctx.stroke();
  }
  const fs=Math.max(9,Math.min(13,scale*.22));
  ctx.font="800 "+fs+"px sans-serif"; ctx.textAlign="center";
  for (const m2 of all){
    const r=pitchOf(m2)*1.075*scale;
    ctx.beginPath(); ctx.arc(sx(m2.x),sy(m2.y),r*1.18,0,Math.PI*2);
    ctx.strokeStyle=m2===selNode?"#ffd166":"rgba(255,209,102,.4)";
    ctx.lineWidth=m2===selNode?3:2; ctx.stroke();
    const txt=Math.round(Math.abs(m2.rpm))+" · ↻"+Math.abs(m2.torque).toFixed(1);
    const w2=ctx.measureText(txt).width+10;
    ctx.fillStyle="rgba(8,11,16,.85)";
    ctx.fillRect(sx(m2.x)-w2/2,sy(m2.y)-r-fs*1.5,w2,fs*1.3);
    ctx.fillStyle="#ffe9a8"; ctx.fillText(txt,sx(m2.x),sy(m2.y)-r-fs*.5);
  }
  ctx.restore();
}

function drawReadouts(){
  if (scale<26) return;
  ctx.textAlign="center";
  const fs=Math.max(9,Math.min(15,scale*.26));
  ctx.font="800 "+fs+"px sans-serif";
  for (const n of nodes){
    if (!n.ref) continue;
    const d=KINDS[n.kind];
    const rpm=Math.abs(n.rpm);
    let txt=null,ok=false;
    if (n.role==="mach"){
      if (n.mt===M_RADAR){ txt=Math.round(rpm)+" / 250"; ok=Math.abs(rpm-RADAR_RPM)<=RADAR_TOL; }
      else if (n.mt===M_GEN){ txt=Math.round(rpm)+" / 900"; ok=Math.abs(rpm-GEN_TARGET)<=200; }
      else if (n.mt===M_CRUSH){ txt=Math.round(rpm)+" \u2264350"; ok=rpm<=CRUSH_LIMIT&&rpm>1; }
      else if (n.mt===M_DRILL||n.mt===M_CRUSH){
        const t=n.strata;
        const f=Math.min(1,Math.abs(n.torque)/Math.max(.01,n.need||1));
        if (!t||t.res<=0){ txt="warstwa pusta — wierć głębiej"; ok=false; }
        else if (n.atBottom){ txt="⛏ "+(n.depth||0).toFixed(1)+" m · dno terenu, kup sektor niżej"; ok=false; }
        else if (f<.95){
          txt=(n.inRock?"⛰ LITA SKAŁA · ":"⛏")+(n.depth||0).toFixed(1)+"m · tempo "+
              Math.round(f*100)+"% (↻"+Math.abs(n.torque).toFixed(1)+"/"+
              (n.need||1).toFixed(1)+")"; ok=false;
        } else { txt="⛏ "+(n.depth||0).toFixed(1)+" m · "+QUAL[t.q].n; ok=true; }
      }
      else { txt=Math.round(rpm)+" RPM"; ok=rpm>1; }
    } else if (d.gov){
      const t=n.ref.tgt===undefined?GOV_TARGETS[0]:n.ref.tgt;
      txt=t?("\u2913 "+t):"\u2913 brak"; ok=n.lim<1;
    } else continue;
    const px=sx(n.x), py=sy(n.y)+d.pitch*1.075*scale+fs*1.6;
    const w=ctx.measureText(txt).width+10;
    ctx.fillStyle="rgba(9,13,19,.82)";
    ctx.fillRect(px-w/2,py-fs*.95,w,fs*1.35);
    ctx.fillStyle=ok?"#7fe3a5":"#e0a355";
    ctx.fillText(txt,px,py+fs*.2);
  }
}

function draw(){
  ctx.fillStyle="#0d1219"; ctx.fillRect(0,0,W,H);
  ctx.save();
  if (shake>0) ctx.translate((Math.random()-.5)*shake*10,(Math.random()-.5)*shake*10);
  if (jamFlash>0){ ctx.fillStyle=`rgba(210,50,50,${jamFlash*.16})`; ctx.fillRect(0,0,W,H); }
  if (critFlash>0){ ctx.fillStyle=`rgba(255,220,120,${critFlash*.12})`; ctx.fillRect(0,0,W,H); }

  drawSectors();
  drawStrata();
  for (const t of S.sectors)
    for (const b of rocksOf(t)){
      const bx2=sx(b.x),by2=sy(b.y),rr=b.r*scale;
      ctx.beginPath();
      for (let i=0;i<7;i++){
        const a=i/7*Math.PI*2, rad=rr*(.82+((i*37)%13)/40);
        i?ctx.lineTo(bx2+Math.cos(a)*rad,by2+Math.sin(a)*rad)
         :ctx.moveTo(bx2+Math.cos(a)*rad,by2+Math.sin(a)*rad);
      }
      ctx.closePath();
      ctx.fillStyle="#161c26"; ctx.fill();
      ctx.strokeStyle="rgba(90,105,128,.55)"; ctx.lineWidth=Math.max(1.5,rr*.09); ctx.stroke();
    }
  drawShafts2();
  drawShafts();
  drawChains();
  drawBelts();

  if (pipeMode){
    const gx=Math.round(wx(mouse.x)/PIPE.step)*PIPE.step, gy=Math.round(wy(mouse.y)/PIPE.step)*PIPE.step;
    const r=PIPE.step*scale*.34;
    ctx.strokeStyle=inBoard(gx,gy)?"rgba(120,200,255,.8)":"rgba(220,110,110,.7)";
    ctx.lineWidth=2; ctx.strokeRect(sx(gx)-r,sy(gy)-r,r*2,r*2);
  }

  // silnik
  ctx.fillStyle="#1e2531"; ctx.fillRect(sx(-2.4),sy(G.crankY+1.5),4.8*scale,.85*scale);
  ctx.fillStyle="#6f7b8e"; ctx.textAlign="center"; ctx.font="700 11px sans-serif";
  ctx.fillText("SILNIK",sx(0),sy(G.crankY+1.75));

  if (drag.n) drawConnectPreview();
  for (const n of nodes) if (n!==drag.n) drawNode(n,false);
  if (drag.n) drawNode(drag.n,true);
  drawBranch();
  drawReadouts();


  for (const p of parts){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
    const ps=sprReady?tinted(p.g<.15?"dust":"spark",p.col):null;
    if (ps){ const q=p.sz*3.2; ctx.drawImage(ps,p.x-q/2,p.y-q/2,q,q); }
    else { ctx.fillStyle=p.col; ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz); }
  }
  ctx.globalAlpha=1;
  for (const f of floats){
    ctx.globalAlpha=Math.max(0,Math.min(1,f.life*1.5));
    ctx.font=`800 ${f.big?18:13}px sans-serif`;
    ctx.textAlign="center"; ctx.fillStyle=f.col; ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

const mkt=document.getElementById("mkt"), mctx=mkt.getContext("2d");
let MW=0,MH=0,bigEl=null,bigCtx=null,BW=0,BH=0,tickerOn=true;

function sizeCharts(){
  const d=Math.min(window.devicePixelRatio||1,2);
  const r=mkt.getBoundingClientRect();
  MW=r.width||120; MH=r.height||34;
  mkt.width=Math.round(MW*d); mkt.height=Math.round(MH*d);
  mctx.setTransform(d,0,0,d,0,0);
  bigEl=document.getElementById("mktBig");
  if (bigEl){
    bigCtx=bigEl.getContext("2d");
    const br=bigEl.getBoundingClientRect();
    BW=br.width||300; BH=br.height||120;
    bigEl.width=Math.round(BW*d); bigEl.height=Math.round(BH*d);
    bigCtx.setTransform(d,0,0,d,0,0);
  } else bigCtx=null;
}

function chartRange(){
  let lo=1e9,hi=-1e9;
  for (let i=0;i<MERCH.length;i++)
    for (let k=0;k<histN;k++){ const v=hist[i][k]; if (v<lo) lo=v; if (v>hi) hi=v; }
  if (lo>hi){ lo=0; hi=1; }
  const pad=(hi-lo)*.15+1e-6;
  return {lo:lo-pad,hi:hi+pad};
}

function drawChart(c,w,h,big){
  c.fillStyle="#0d1219"; c.fillRect(0,0,w,h);
  if (histN<2) return;
  const {lo,hi}=chartRange();
  const X=k=>w*(k/(HIST-1)), Y=v=>h-(v-lo)/(hi-lo)*h;
  if (big){
    c.strokeStyle="rgba(255,255,255,.05)"; c.lineWidth=1;
    for (let g=1;g<4;g++){ const y=h*g/4; c.beginPath(); c.moveTo(0,y); c.lineTo(w,y); c.stroke(); }
  }
  for (let i=0;i<MERCH.length;i++){
    c.beginPath();
    for (let k=0;k<histN;k++){ const x=X(k),y=Y(hist[i][k]); k?c.lineTo(x,y):c.moveTo(x,y); }
    c.strokeStyle=MERCH[i].c; c.lineWidth=big?1.9:1.3; c.stroke();
    const x=X(histN-1),y=Y(hist[i][histN-1]);
    c.beginPath(); c.arc(x,y,big?2.8:1.9,0,Math.PI*2); c.fillStyle=MERCH[i].c; c.fill();
  }
  if (big){
    c.fillStyle="rgba(200,215,235,.45)"; c.font="10px sans-serif"; c.textAlign="left";
    c.fillText("cena surowca (zł/szt.)",6,13);
  }
}

function drawMarket(){
  if (tickerOn&&MW) drawChart(mctx,MW,MH,false);
  if (bigCtx&&BW) drawChart(bigCtx,BW,BH,true);
  const b=bestMerch();
  const t=document.getElementById("tkTxt");
  if (!t) return;
  const prev=histN>1?hist[b][histN-2]*oreValue():priceOf(b);
  const up=priceOf(b)>=prev;
  t.innerHTML=`<span style="color:${up?"#6edca0":"#e07a6a"}">${up?"▲":"▼"}</span> `+
              `<b>${priceOf(b).toFixed(2)}</b> zł`;
}

function local(e){
  const r=cv.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top,cy:e.clientY,bottom:r.bottom};
}
function doTap(px,py){
  for (const r of saleRects)
    if (px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h){ buySector(r.o.cx,r.o.cy); return; }
  comboT=1; combo=Math.min(20,combo+1);
  let add=(UPGRADES[0].base+UPGRADES[0].per*S.ulvl[0])*(1+combo*.08);
  if (Math.random()<S.ulvl[4]*.025){
    add*=5; critFlash=1; shake=Math.max(shake,.4); sfx.crit();
    spawnFloat(px,py-14,"KRYT!","#ffd166",true); burst(px,py,18,"#ffd166",4);
  } else { burst(px,py,5,"#ffd98a",2.2); sfx.tap(boost,combo); }
  boost=Math.min(BOOST_MAX,boost+add); punch=1;
}

cv.addEventListener("pointerdown",e=>{
  sfx.unlock();
  if (drawerTab>=0&&drawerTab!==T_MAP){ closeDrawer(); return; }
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  const p=local(e); ptrs.set(e.pointerId,p); mouse.x=p.x; mouse.y=p.y;

  if (pipeMode&&ptrs.size===1&&e.button!==2){ placePipe(wx(p.x),wy(p.y)); return; }
  if (beltMode&&ptrs.size===1){
    const ci=chainNear(wx(p.x),wy(p.y));
    if (ci>=0&&!beltFirst){ S.chains.splice(ci,1); dirty=true; sfx.remove(); cancelBelt(); return say("Łańcuch zdjęty"); }
    const si=shaftNear(wx(p.x),wy(p.y));
    if (si>=0&&!beltFirst){ S.shafts.splice(si,1); dirty=true; sfx.remove(); cancelBelt(); return say("Wał zdjęty"); }
    const bi=beltNear(wx(p.x),wy(p.y));
    if (bi>=0&&!beltFirst){ S.belts.splice(bi,1); dirty=true; sfx.remove(); cancelBelt(); return say("Pasek zdjęty"); }
    const n=nodeAt(wx(p.x),wy(p.y));
    if (n) tryBelt(n); else { cancelBelt(); say("Anulowano"); }
    return;
  }
  if (ptrs.size===2){
    if (drag.n){ drag.n.x=drag.ox; drag.n.y=drag.oy; drag.n=null; dirty=true; }
    pan=null;
    const it=[...ptrs.values()];
    pinch={d0:Math.hypot(it[0].x-it[1].x,it[0].y-it[1].y),s0:scale,
           mx:(it[0].x+it[1].x)/2,my:(it[0].y+it[1].y)/2,cx0:camX,cy0:camY};
    return;
  }
  if (ptrs.size>2) return;
  const n=nodeAt(wx(p.x),wy(p.y));
  if (n&&n.ref){
    drag.n=n; drag.ox=n.x; drag.oy=n.y;
    const tr=el("trash"); if (tr) tr.style.display="flex";
    say("Przeciągnij na dół, aby zdjąć · przytrzymaj, aby zdjąć od razu");
    cancelHold();
    holdT=setTimeout(()=>{
      holdT=null;
      if (drag.n===n&&Math.hypot(n.x-drag.ox,n.y-drag.oy)<.12){
        drag.n=null; snapPrev=null;
        const t2=el("trash"); if (t2){ t2.style.display="none"; t2.classList.remove("hot"); }
        removeGear(n);
      }
    },550);
  }
  else pan={x0:p.x,y0:p.y,cx0:camX,cy0:camY,moved:false};
});

cv.addEventListener("pointermove",e=>{
  const p=local(e); mouse.x=p.x; mouse.y=p.y;
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,p);
  if (pinch&&ptrs.size>=2){
    const it=[...ptrs.values()];
    const d=Math.hypot(it[0].x-it[1].x,it[0].y-it[1].y);
    if (d>4&&pinch.d0>4){
      const wxm=(pinch.mx-W/2)/pinch.s0+pinch.cx0,wym=pinch.cy0-(pinch.my-H/2)/pinch.s0;
      scale=pinch.s0*(d/pinch.d0); clampCam();
      camX=wxm-(pinch.mx-W/2)/scale; camY=wym+(pinch.my-H/2)/scale; clampCam();
    }
    return;
  }
  if (drag.n){
    drag.n.x=wx(p.x); drag.n.y=wy(p.y); snapPrev=snapFor(drag.n,drag.n.x,drag.n.y);
    if (Math.hypot(drag.n.x-drag.ox,drag.n.y-drag.oy)>.12) cancelHold();
    const tr=el("trash");
    if (tr) tr.classList.toggle("hot",p.y>cv.getBoundingClientRect().height-78);
    return;
  }
  if (pan){
    const dx=p.x-pan.x0,dy=p.y-pan.y0;
    if (Math.abs(dx)>5||Math.abs(dy)>5) pan.moved=true;
    camX=pan.cx0-dx/scale; camY=pan.cy0+dy/scale; clampCam();
  }
});

function finish(e){
  const p=ptrs.get(e.pointerId)||local(e);
  ptrs.delete(e.pointerId);
  if (pinch){ if (ptrs.size<2) pinch=null; return; }
  if (drag.n){
    cancelHold();
    const n=drag.n; drag.n=null; snapPrev=null;
    const moved=Math.hypot(n.x-drag.ox,n.y-drag.oy);
    const tr=el("trash");
    if (tr){ tr.style.display="none"; tr.classList.remove("hot"); }
    if (p.y>cv.getBoundingClientRect().height-78){ removeGear(n); return; }
    if (KINDS[n.kind].vari&&n.ref&&moved<.12){
      n.x=drag.ox; n.y=drag.oy;
      const cur=n.ref.k===undefined?1:n.ref.k;
      n.ref.k=VARI_K[(VARI_K.indexOf(cur)+1)%VARI_K.length];
      dirty=true; sfx.place(); say("Wariator: przełożenie ×"+n.ref.k);
      return;
    }
    if (KINDS[n.kind].centri&&n.ref&&moved<.12){
      n.x=drag.ox; n.y=drag.oy;
      const cur=n.ref.tgt===undefined?900:n.ref.tgt;
      n.ref.tgt=GOV_TARGETS[(GOV_TARGETS.indexOf(cur)+1)%GOV_TARGETS.length]||900;
      dirty=true; sfx.place(); say("Sprzęgło rozłącza powyżej "+n.ref.tgt+" RPM");
      return;
    }
    if (KINDS[n.kind].gov&&n.ref&&Math.hypot(n.x-drag.ox,n.y-drag.oy)<.12){
      n.x=drag.ox; n.y=drag.oy;
      const cur=n.ref.tgt===undefined?GOV_TARGETS[0]:n.ref.tgt;
      n.ref.tgt=GOV_TARGETS[(GOV_TARGETS.indexOf(cur)+1)%GOV_TARGETS.length];
      dirty=true; sfx.place();
      say(n.ref.tgt?("Regulator: "+n.ref.tgt+" RPM"):"Regulator: bez limitu");
      return;
    }
    if (!KINDS[n.kind].gov&&!KINDS[n.kind].clutch&&moved<.12){
      selNode=(selNode===n)?null:n;          // podgląd gałęzi napędu
      sfx.place(); return;
    }
    if (KINDS[n.kind].clutch&&n.ref&&Math.hypot(n.x-drag.ox,n.y-drag.oy)<.12){
      n.x=drag.ox; n.y=drag.oy; n.ref.off=!n.ref.off; dirty=true; sfx.place();
      say(n.ref.off?"Sprzęgło rozłączone":"Sprzęgło załączone"); return;
    }
    const sp=snapFor(n,n.x,n.y);
    if (sp){ n.x=sp.x; n.y=sp.y; n.ref.x=sp.x; n.ref.y=sp.y; dirty=true; pipeDirty=true;
      sfx.place(); burst(sx(sp.x),sy(sp.y),6,KINDS[n.kind].col,2); return; }
    const okSurf=(n.role!=="mach")||sectorOf(n.x,n.y).cy===0;
    if (inBoard(n.x,n.y)&&posFree(n.x,n.y,pitchOf(n),n)&&okSurf){
      n.ref.x=n.x; n.ref.y=n.y; dirty=true; pipeDirty=true; sfx.place(); return; }
    n.x=drag.ox; n.y=drag.oy; dirty=true;
    say(okSurf?"Nie ma tam miejsca":"Maszyny tylko na powierzchni");
    return;
  }
  if (pan){ if (!pan.moved) doTap(p.x,p.y); pan=null; }
}
cv.addEventListener("pointerup",finish);
cv.addEventListener("pointercancel",finish);
cv.addEventListener("contextmenu",e=>{
  e.preventDefault();
  const p=local(e); const n=nodeAt(wx(p.x),wy(p.y));
  if (n&&n.ref) removeGear(n);
});
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const p=local(e),wxm=wx(p.x),wym=wy(p.y);
  scale*=e.deltaY<0?1.12:1/1.12; clampCam();
  camX=wxm-(p.x-W/2)/scale; camY=wym+(p.y-H/2)/scale; clampCam();
},{passive:false});

/* ════════════ TRYBY (zakładki) ════════════ */

const el=id=>document.getElementById(id);
const T_PARTS=0,T_MACH=1,T_MARKET=2,T_MAP=3,T_DEV=4,T_RES=5;
const TABS=[
 {i:"⚙", l:"Części"},
 {i:"🏭",l:"Maszyny"},
 {i:"📈",l:"Giełda"},
 {i:"🗺",l:"Mapa"},
 {i:"⚡",l:"Rozwój"},
 {i:"🔬",l:"Badania"},
];
let drawerTab=-1;
const tabBtns=[];

TABS.forEach((t,i)=>{
  const b=document.createElement("button");
  b.innerHTML=`<span>${t.i}</span>${t.l}`;
  b.onclick=()=>{ sfx.unlock(); toggleTab(i); };
  el("tabs").appendChild(b); tabBtns.push(b);
});

function toggleTab(i){
  cancelBelt();
  drawerTab = drawerTab===i ? -1 : i;
  el("drawer").classList.toggle("map",drawerTab===T_MAP);
  el("drawer").style.display = drawerTab<0 ? "none" : "flex";
  tabBtns.forEach((b,j)=>b.classList.toggle("act",j===drawerTab));
  setView(drawerTab===T_MAP);
  if (drawerTab>=0) renderDrawer();
  else { bigCtx=null; dynUp=[]; }
}
function closeDrawer(){ if (drawerTab>=0) toggleTab(drawerTab); }

function setView(w){
  if (w===wideView){ return; }
  wideView=w; fitCamera(true);
  toast(wideView?"MAPA — kliknij kwadrat, aby wykupić sektor":"WARSZTAT");
  syncTools();
}

/* ── karty: budowane RAZ, odświeżane bez przebudowy DOM ── */
let dynUp=[];

function card(icon,col,title,desc,extra,btn,ok,fn,alt,live){
  const d=document.createElement("div"); d.className="card";
  const ci=document.createElement("div"); ci.className="ci";
  ci.style.background=col; ci.textContent=icon;
  const cb=document.createElement("div"); cb.className="cb";
  const bt=document.createElement("b"); bt.textContent=title;
  const sm=document.createElement("small"); sm.textContent=desc;
  const em=document.createElement("em"); em.textContent=extra||"";
  cb.appendChild(bt); cb.appendChild(sm); if (extra!==undefined) cb.appendChild(em);
  const b=document.createElement("button");
  b.textContent=btn; b.disabled=!ok; if (alt) b.className="alt";
  b.onclick=ev=>{ ev.stopPropagation(); fn(); };
  d.appendChild(ci); d.appendChild(cb); d.appendChild(b);
  if (live) dynUp.push(()=>{
    const v=live();
    if (v.icon!==undefined&&ci.textContent!==v.icon) ci.textContent=v.icon;
    if (v.title!==undefined&&bt.textContent!==v.title) bt.textContent=v.title;
    if (v.desc!==undefined&&sm.textContent!==v.desc) sm.textContent=v.desc;
    if (v.extra!==undefined&&em.textContent!==v.extra) em.textContent=v.extra;
    if (v.btn!==undefined&&b.textContent!==v.btn) b.textContent=v.btn;
    if (v.ok!==undefined&&b.disabled===v.ok) b.disabled=!v.ok;
  });
  return d;
}
function secHead(t){ const d=document.createElement("div"); d.className="sec"; d.textContent=t; return d; }
function lockedCard(k){
  const d=document.createElement("div"); d.className="card lock";
  d.innerHTML=`<div class="ci" style="background:#2a3240">🔒</div>
    <div class="cb"><b>${k.name}</b><small>${k.desc}</small>
    <em>Wymaga ${k.req.sec} sektorów</em></div>`;
  return d;
}
/* odświeżanie treści bez ruszania struktury — scroll zostaje na miejscu */
function refreshDrawer(){ for (let i=0;i<dynUp.length;i++) dynUp[i](); }

  L.innerHTML=""; dynUp=[]; bigCtx=null;

    L.appendChild(secHead("Przeniesienie napędu"));
    L.appendChild(card("⛓","#3b4b60",BELT.name,BELT.desc,

    L.appendChild(card("⛓","#4a5a3f",CHAIN.name,CHAIN.desc,

    L.appendChild(card("▬","#454f60",SHAFT.name,SHAFT.desc,

      ()=>({extra:"Masz "+S.shafts.length+" · strata tylko "+(SHAFT.loss*100).toFixed(0)+"%",

    GROUPS.forEach((g,gi)=>{

  else if (drawerTab===T_MACH){

    L.appendChild(secHead("Silnik · zapas mocy "+powerCap().toFixed(1)));
    ENGINES.forEach((e,i)=>{
      const own=(S.engine||0)===i;
      L.appendChild(card(["✋","♨","🌀","⛽"][i],shade(e.col,.7),e.n,e.d,

        ()=>{ if (S.gold<e.cost) return say("Za mało złota");
              S.gold-=e.cost; S.engine=i; dirty=true; sfx.board();

        ()=>({btn:((S.engine||0)===i)?"AKTYWNY":(e.cost?fmt(e.cost):"WEŹ"),

    L.appendChild(secHead("Maszyny · pobór mocy "+powerDraw.toFixed(1)+" / "+powerCap().toFixed(1)));

  else if (drawerTab===T_MARKET){
    const c=document.createElement("canvas"); c.id="mktBig"; L.appendChild(c);

    MERCH.forEach((m,i)=>{

  }

  else if (drawerTab===T_RES){
    const lg=document.createElement("div"); lg.className="legend";
    lg.innerHTML="Punkty badań zdobywasz wydobyciem. <b>Nadobroty</b> i <b>Przeciążenie</b> "+

    L.appendChild(lg);
    RBRANCH.forEach((bn,bi)=>{
      L.appendChild(secHead(bn));
      RESEARCH.filter(nd=>nd.b===bi).forEach(nd=>{

          done?"GOTOWE":(nd.c+" pb"),!done&&!lock&&(S.rp||0)>=nd.c,

                ok:!R(nd.id)&&!resLocked(nd)&&(S.rp||0)>=nd.c,
                extra:resLocked(nd)||""})));

    });
  }
  else if (drawerTab===T_DEV){
    L.appendChild(secHead("Ulepszenia"));
    UPGRADES.forEach((u,i)=>{
      const eff=()=>i===0?`+${(u.base+u.per*S.ulvl[i]).toFixed(2)} dopalacza`
                :i===1?`${u.base+u.per*S.ulvl[i]} RPM`

let undoSnap=null, redoSnap=null;
function stateStr(){
  try{ return JSON.stringify({g:S.gears,m:S.machines,gold:S.gold,o:S.owned,
    b:S.belts,sh:S.shafts,ms:S.machStore||{},d:S.debt||0}); }catch(e){ return null; }
}
function applyState(str){
  const d=JSON.parse(str);
  S.gears=d.g; S.machines=d.m; S.gold=d.gold; S.owned=d.o;
  S.belts=d.b||[]; S.shafts=d.sh||[]; S.machStore=d.ms||{}; S.debt=d.d||0;
}
function snapshot(){
  undoSnap=stateStr(); redoSnap=null;   // nowa akcja kasuje historię "przywróć"
}
function undo(){
  if (!undoSnap) return say("Nie ma czego cofnąć");
  try{
    const cur=stateStr();
    applyState(undoSnap);
    redoSnap=cur; undoSnap=null;
    selNode=null; closeRmChoice(); syncNodes(false); rebuild();
    sfx.remove(); toast("Cofnięto");
  }catch(e){ say("Nie udało się cofnąć"); }
}
function redo(){
  if (!redoSnap) return say("Nic do przywrócenia");
  try{
    const cur=stateStr();
    applyState(redoSnap);
    undoSnap=cur; redoSnap=null;
    selNode=null; closeRmChoice(); syncNodes(false); rebuild();
    sfx.place(); toast("Przywrócono");
  }catch(e){ say("Nie udało się przywrócić"); }
}
